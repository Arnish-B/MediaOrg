/* ----------------------------------------------------------------- lists */

function hexA(hex, a) {
  var h = String(hex || "").replace("#", "");
  if (h.length !== 6) return "rgba(255,255,255,.14)";
  var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return "rgba(255,255,255,.14)";
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

// The seeded bar colours are mid-tone, which is right for a fill but too dark
// for a letter sitting on that fill. Lift it toward white for the glyph.
function lift(hex, t) {
  var h = String(hex || "").replace("#", "");
  if (h.length !== 6) return "#e4e2dc";
  var c = [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
  if (c[0] !== c[0] || c[1] !== c[1] || c[2] !== c[2]) return "#e4e2dc";
  return "rgb(" + c.map(function (v) { return Math.round(v + (255 - v) * t); }).join(",") + ")";
}

/* One avatar per person who has put this title on a list you are allowed to
   see: yours for either of your lists, theirs only for the shared one, because
   their private list is private. You come first and sit on top, every time, so
   the stack never reorders itself between rows. */
function whoStack(k) {
  var mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
  var other = state.users.filter(function (u) { return !state.me || u.id !== state.me.id; })[0];
  var av = [];
  if (mi.shared || mi.solo) {
    av.push({ initial: state.me ? state.me.initial : "?",
      colour: state.me ? state.me.bar_colour : "#1D9E75",
      solo: !!mi.solo,
      label: mi.solo && !mi.shared ? "you, privately" : (mi.solo ? "you, shared and privately" : "you") });
  }
  if (th.shared && other) {
    av.push({ initial: other.initial, colour: other.bar_colour, solo: false,
      label: other.display_name });
  }
  if (!av.length) return "";
  return '<div class="wstack" role="img" aria-label="' +
    esc("Listed by " + av.map(function (a) { return a.label; }).join(" and ")) + '">' +
    av.map(function (a, n) {
      return '<span class="wa' + (a.solo ? " solo" : "") + '" style="z-index:' + (9 - n) +
        ";background:" + hexA(a.colour, 0.26) + ";color:" + lift(a.colour, 0.55) + '">' +
        esc(a.initial) + (a.solo ? '<i class="pv"></i>' : "") + "</span>";
    }).join("") + "</div>";
}

/* The pass control appears on exactly one kind of row: shared, put forward by
   the other person, not seconded by you. A match is not one-sided and so is not
   refusable here; your own entries you simply un-add. */
function canPass(k) {
  var mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
  return !!(th.shared && !mi.shared && otherUser());
}

var passing = null, passedNote = null;

var RETURN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M9 5 4 10l5 5"></path><path d="M4 10h10a5 5 0 0 1 0 10h-3"></path></svg>';

function listRows(keys, mode) {
  return keys.map(function (k) {
    var rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
    var th = state.theirs[k] || blank();
    var poster = '<div class="th" style="' +
      (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '"></div>';

    /* The confirm takes over the row it belongs to rather than opening a dialog
       over it. The title stays on screen under your thumb, which is what you
       need to see while deciding, and there is no second surface to dismiss. */
    if (mode === "shared" && passing === k && canPass(k)) {
      return '<div class="lrow pz">' + poster +
        '<div class="lt">Hand back to ' + esc(otherName()) + "?" +
        "<span>Leaves the shared pool and lands on their own list. " +
        "They keep it; you stop seeing it here.</span></div>" +
        '<button class="pbtn" data-keep="' + esc(k) + '">Keep</button>' +
        '<button class="pbtn go" data-pass="' + esc(k) + '">Pass</button></div>';
    }

    var tail = "";
    if (mode === "shared" && canPass(k)) {
      tail = '<button class="pbx" data-ask="' + esc(k) + '" aria-label="' +
        esc("Hand " + (rec.title || "this title") + " back to " + otherName()) +
        '">' + RETURN_ICON + "</button>";
    } else if (mode === "solo" && th.passed) {
      tail = '<span class="ptag">' + esc(otherName()) + " passed</span>";
    }

    return '<div class="lrow">' + poster +
      '<div class="lt">' + esc(rec.title || k) +
      (mi.rating != null ? ' <span style="color:#5dcaa5;font-size:12px">' +
        mi.rating.toFixed(1) + "</span>" : "") +
      "</div>" + whoStack(k) + '<div class="ly">' + (rec.year || "") + "</div>" +
      tail + "</div>";
  }).join("");
}

var listMode = "mutual";

function keysFor(mode) {
  var keys = [], k;
  if (mode === "mutual") keys = mutualKeys();
  else if (mode === "shared") {
    var set = {};
    for (k in state.mine) if (state.mine[k].shared) set[k] = 1;
    for (k in state.theirs) if (state.theirs[k].shared) set[k] = 1;
    keys = Object.keys(set);
  } else {
    for (k in state.mine) if (state.mine[k].solo) keys.push(k);
  }
  return keys;
}

function showList(mode) {
  listMode = mode || listMode;
  var keys = keysFor(listMode);
  var counts3 = [mutualKeys().length, keysFor("shared").length, keysFor("solo").length];
  var seg = '<div class="seg">' +
    [["mutual", "Both", counts3[0]], ["shared", "Shared", counts3[1]], ["solo", "Only me", counts3[2]]]
      .map(function (p) {
        return '<div class="sg' + (listMode === p[0] ? " on" : "") + '" data-m="' + p[0] + '">' +
          p[1] + (p[2] ? " " + p[2] : "") + "</div>";
      }).join("") + "</div>";

  /* The undo lives in the list rather than in a timed toast. A pass moves data
     that belongs to someone else, and a five-second window to take it back is a
     race the user loses every time they look away from the phone. This note
     stays until the sheet closes or the segment changes. */
  var note = "";
  if (passedNote && listMode === "shared" && lastPass && lastPass.key === passedNote) {
    var pr = mediaCache[passedNote] || {};
    note = '<div class="pnote"><span>' + esc(pr.title || "That title") +
      " is now on " + esc(otherName()) + "'s own list.</span>" +
      '<b id="pUndo">Undo</b></div>';
  }

  function paint(bodyHTML) {
    openSheet("Lists", seg + note + bodyHTML);
    var body = el("shBody");
    Array.prototype.forEach.call(body.querySelectorAll(".sg"), function (n) {
      n.onclick = function () {
        passing = null; passedNote = null;
        showList(n.dataset.m);
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-ask]"), function (n) {
      n.onclick = function () { passing = n.getAttribute("data-ask"); showList(); };
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-keep]"), function (n) {
      n.onclick = function () { passing = null; showList(); };
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-pass]"), function (n) {
      n.onclick = function () {
        var k = n.getAttribute("data-pass");
        passing = null; passedNote = k;
        passBack(k).catch(function (e) {
          passedNote = null;
          flash("so", "Not saved: " + e.message);
          showList();
        });
        counts();
        showList();
      };
    });
    var u = body.querySelector("#pUndo");
    if (u) {
      u.onclick = function () {
        passedNote = null;
        undoPass().catch(function (e) { flash("so", "Not undone: " + e.message); });
        counts();
        showList();
      };
    }
  }

  if (!keys.length) {
    paint('<p class="msg">' + (listMode === "mutual"
      ? "No matches yet. A title lands here once you have both swiped it right."
      : "Nothing here yet.") + "</p>");
    return;
  }
  paint('<p class="msg">Loading…</p>');
  loadMediaRows(keys).then(function () {
    paint(listRows(keys, listMode) + '<p class="credit">' + (listMode === "mutual"
      ? "Titles you have both swiped right. This is the list that decides what you watch together."
      : listMode === "shared"
        ? "Everything either of you put forward. One initial is a request; both is a match. " +
          "A request only " + esc(otherName()) + " made can be handed back with the arrow: " +
          "it leaves this list and stays on theirs, privately. Matches cannot — " +
          "you already agreed."
        : "Yours alone. " + esc(otherName()) + " never sees this list.") + "</p>");
  });
}

/* ---------------------------------------------------------------- search */

var searchTimer = 0, searchHits = {}, searchTerm = "";

function searchAll(term) {
  var jobs = [];
  if (worker) {
    jobs.push(tmdb("search/multi", { query: term, include_adult: false, language: "en-US", page: 1 })
      .then(function (d) {
        return (d.results || [])
          .filter(function (r) { return (r.media_type === "movie" || r.media_type === "tv") && r.poster_path; })
          .map(function (r) { return r.media_type === "movie" ? fromTmdbMovie(r) : fromTmdbTv(r); });
      }).catch(function () { return []; }));
  } else {
    jobs.push(getJSON("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(term))
      .then(function (a) {
        return (a || []).filter(function (x) { return x.show && x.show.image; })
          .map(function (x) { return fromTvmaze(x.show); });
      }).catch(function () { return []; }));
  }
  jobs.push(gJikan()
    .then(function () {
      return getJSON("https://api.jikan.moe/v4/anime?q=" + encodeURIComponent(term) + "&limit=8&sfw=true");
    })
    .then(function (j) {
      return (j.data || []).filter(function (a) { return a.images; }).map(fromJikan);
    }).catch(function () { return []; }));

  return Promise.all(jobs).then(function (r) {
    var seen = {}, out = [];
    r[0].concat(r[1]).forEach(function (it) {
      if (!it.title || seen[it.key]) return;
      seen[it.key] = 1;
      out.push(it);
    });
    return out;
  });
}

function searchRows(items) {
  searchHits = {};
  return items.slice(0, 24).map(function (it) {
    searchHits[it.key] = it;
    var mi = state.mine[it.key] || blank();
    var badge = mi.rating != null ? mi.rating.toFixed(1) : (mi.watched ? "seen" : (mi.shared || mi.solo ? "listed" : ""));
    return '<div class="srow" data-k="' + esc(it.key) + '">' +
      '<div class="th" style="' + (it.poster ? "background-image:url('" + esc(it.poster) + "')" : "") + '"></div>' +
      '<div class="lt">' + esc(it.title) +
        '<div class="ly">' + esc(it.kind) + (it.year ? " · " + it.year : "") + "</div></div>" +
      (badge ? '<span class="sbadge">' + esc(badge) + "</span>" : "") +
      '<button class="slog" data-log="' + esc(it.key) + '">Log</button>' +
    "</div>";
  }).join("");
}

function bindSearchRows() {
  var box = el("sres");
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll(".slog"), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      var it = searchHits[b.dataset.log];
      if (it) logSheet(it);
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll(".srow"), function (row) {
    row.onclick = function () {
      var it = searchHits[row.dataset.k];
      if (it) jumpTo(it);
    };
  });
}

function runSearch(term) {
  searchTerm = term;
  searchAll(term).then(function (items) {
    if (searchTerm !== term) return;
    var box = el("sres");
    if (!box) return;
    box.innerHTML = items.length ? searchRows(items)
      : '<p class="msg">Nothing found for that.</p>';
    bindSearchRows();
  }).catch(function () {
    var box = el("sres");
    if (box) box.innerHTML = '<p class="msg bad">Search failed. Check the worker in Settings.</p>';
  });
}

function openSearch() {
  openSheet("Log a title",
    '<input class="f" id="sq" type="search" placeholder="Film, show or anime" ' +
      'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div id="sres"></div>' +
    '<p class="credit">Tap a row to open it in the feed. Tap <b>Log</b> to mark it ' +
    "without leaving this list.</p>");
  var inp = el("sq");
  searchTerm = "";
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 180);
  inp.oninput = function () {
    var term = inp.value.trim();
    clearTimeout(searchTimer);
    if (term.length < 2) { searchTerm = ""; el("sres").innerHTML = ""; return; }
    el("sres").innerHTML = '<p class="msg">Searching…</p>';
    searchTimer = setTimeout(function () { runSearch(term); }, 280);
  };
  inp.onkeydown = function (ev) {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    clearTimeout(searchTimer);
    var term = inp.value.trim();
    if (term.length >= 2) { el("sres").innerHTML = '<p class="msg">Searching…</p>'; runSearch(term); }
  };
}

/* Drop a title into the feed at the next position and go straight to it, so a
   searched title is read exactly as if it had come up on its own. */
function jumpTo(it) {
  closeSheet();
  el("prof").classList.remove("on");
  setNav("nvFeed");
  var at = -1;
  for (var n = 0; n < state.queue.length; n++) {
    if (state.queue[n].key === it.key) { at = n; break; }
  }
  if (at < 0) {
    at = Math.min(state.i + 1, state.queue.length);
    state.queue.splice(at, 0, it);
  }
  state.i = at;
  navGen++;
  animating = false;
  nodes.forEach(function (nd) { nd._key = null; });
  renderWindow();
  cacheFeed();
}

function logSheet(it) {
  if (!state.me) return;
  var mi = state.mine[it.key] || blank();
  var th = state.theirs[it.key] || blank();
  function b(id, label, on, pri) {
    return '<button class="logb' + (on ? " on" : "") + (pri ? " pri" : "") + '" id="' + id + '">' +
      esc(label) + "</button>";
  }
  openSheet(it.title,
    '<p class="msg">' + esc(it.kind) + (it.year ? " · " + it.year : "") + "</p>" +
    '<div class="logrow">' +
      b("lgW", mi.watched ? "Watched ✓" : "Mark watched", mi.watched) +
      b("lgR", mi.rating != null ? "Rated " + mi.rating.toFixed(1) : "Rate", mi.rating != null) +
    "</div>" +
    '<div class="logrow">' +
      b("lgS", mi.shared ? "On shared ✓" : "Add to shared", mi.shared) +
      b("lgO", mi.solo ? "On yours ✓" : "Keep to myself", mi.solo) +
    "</div>" +
    '<div class="logrow">' + b("lgF", "Open in the feed", false, true) + "</div>" +
    (th.shared && !mi.shared ? '<p class="msg good">' + esc(otherName()) + " already wants this.</p>" : "") +
    '<p class="credit">Logged from search, so the feed stays where it was. ' +
    "A rating always implies watched.</p>");

  function toggle(flagKey, kind) {
    var rec = mineOf(it.key);
    if (rec[flagKey]) {
      rec[flagKey] = false;
      dropInteraction(it, kind).catch(function () {});
    } else {
      rec[flagKey] = true;
      rememberMedia(it).catch(function () {});
      writeInteraction(it, kind).catch(function (e) { flash("so", "Not saved: " + e.message); });
    }
    refreshChrome(it);
    logSheet(it);
  }

  el("lgW").onclick = function () { toggle("watched", "watched"); };
  el("lgS").onclick = function () { toggle("shared", "playlist_shared"); };
  el("lgO").onclick = function () { toggle("solo", "playlist_solo"); };
  el("lgR").onclick = function () { rateSheet(it, undefined); };
  el("lgF").onclick = function () { jumpTo(it); };
}

/* --------------------------------------------------------------- profile */

var pfTab = "tiers";
var libFilter = { type: "all", list: "all", decade: "all", genres: {} };

function touchedKeys() {
  var out = [];
  for (var k in state.mine) {
    var m = state.mine[k];
    if (m.shared || m.solo || m.watched || m.rating != null || m.note) out.push(k);
  }
  return out;
}

function tierOf(rating) {
  if (rating == null) return 0;
  for (var i = 0; i < state.tiers.length; i++) {
    var t = state.tiers[i];
    if (t.lower_bound == null) continue;
    if (rating > Number(t.lower_bound) && rating <= Number(t.upper_bound)) return t.idx;
  }
  return 0;
}

function tileHTML(k) {
  var rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
  return '<div class="tile" data-k="' + esc(k) + '">' +
    '<div class="tp" style="' + (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '"></div>' +
    '<div class="tt">' + esc(rec.title || k) + "</div></div>";
}

function renderTiers() {
  var keys = touchedKeys();
  var byTier = {};
  state.tiers.forEach(function (t) { byTier[t.idx] = []; });
  if (!byTier[0]) byTier[0] = [];
  keys.forEach(function (k) {
    var idx = tierOf((state.mine[k] || blank()).rating);
    (byTier[idx] = byTier[idx] || []).push(k);
  });
  var html = state.tiers.map(function (t) {
    var ks = byTier[t.idx] || [];
    var bounds = t.lower_bound == null ? "no rating"
      : Number(t.lower_bound).toFixed(1) + " – " + Number(t.upper_bound).toFixed(1);
    return '<div class="tier"><div class="tierHead">' +
      '<span class="tl" data-idx="' + t.idx + '">' + esc(t.label) + "</span>" +
      '<span class="tb">' + bounds + "</span>" +
      '<span class="tc">' + ks.length + "</span></div>" +
      (ks.length ? '<div class="strip">' + ks.map(tileHTML).join("") + "</div>"
                 : '<p class="empty">Nothing here yet.</p>') + "</div>";
  }).join("");
  el("pfBody").innerHTML = html +
    '<p class="credit" style="padding:0 18px">Tap a shelf name to rename it. Shelf bounds are fixed; ' +
    "what each one means is yours to decide.</p>";

  Array.prototype.forEach.call(el("pfBody").querySelectorAll(".tl"), function (node) {
    node.onclick = function () {
      var idx = parseInt(node.dataset.idx, 10);
      var t = state.tiers.filter(function (x) { return x.idx === idx; })[0];
      openSheet("Rename shelf",
        '<label class="f" for="tn">Shelf ' + idx + " name</label>" +
        '<input class="f" id="tn" value="' + esc(t.label) + '" maxlength="24">' +
        '<div><button class="f" id="tSave">Save</button></div>');
      el("tSave").onclick = function () {
        var v = el("tn").value.trim();
        if (!v) { el("tn").focus(); return; }
        t.label = v; closeSheet(); renderTiers();
        sbPatch("tier", "user_id=eq." + state.me.id + "&idx=eq." + idx, { label: v }).catch(function () {});
      };
    };
  });
  bindTiles();
}

function bindTiles() {
  Array.prototype.forEach.call(el("pfBody").querySelectorAll("[data-k]"), function (node) {
    node.onclick = function () {
      var k = node.dataset.k, rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
      var th = state.theirs[k] || blank();
      var lines = [];
      if (mi.rating != null) lines.push("You rated it " + mi.rating.toFixed(1));
      if (mi.watched) lines.push("Marked watched");
      if (mi.shared && th.shared) lines.push("You both want it");
      else if (mi.shared) lines.push("You put it on the shared list");
      else if (th.shared) lines.push(otherName() + " put it on the shared list");
      if (mi.solo) lines.push("On your own list");
      openSheet(rec.title || k,
        '<p class="msg">' + (rec.year ? rec.year + " · " : "") + esc(rec.kind || "") + "</p>" +
        (lines.length ? '<p class="msg">' + esc(lines.join(". ")) + ".</p>" : "") +
        (mi.note ? '<p class="short" style="margin-top:14px">' + esc(mi.note) + "</p>" : "") +
        '<p class="credit">Editing from here arrives with the library rework; for now the feed is where you change things.</p>');
    };
  });
}

function renderLibrary() {
  var keys = touchedKeys();
  var kinds = {}, decades = {}, genres = {};
  keys.forEach(function (k) {
    var rec = mediaCache[k] || {};
    if (rec.kind) kinds[rec.kind] = 1;
    if (rec.year) decades[Math.floor(rec.year / 10) * 10] = 1;
    (rec.genres || []).forEach(function (g) { genres[g] = 1; });
  });

  function chipRow(id, label, active) {
    return '<div class="fch' + (active ? " on" : "") + '" data-f="' + id + '">' + esc(label) + "</div>";
  }
  var f = libFilter;
  var typeChips = ["all"].concat(Object.keys(kinds).sort())
    .map(function (t) { return chipRow("type:" + t, t === "all" ? "All types" : t, f.type === t); }).join("");
  var listChips = [["all", "Everything"], ["both", "Both want"], ["shared", "Shared"],
                   ["solo", "Only me"], ["rated", "Rated"], ["watched", "Watched"], ["note", "With a note"]]
    .map(function (p) { return chipRow("list:" + p[0], p[1], f.list === p[0]); }).join("");
  var decChips = ["all"].concat(Object.keys(decades).sort(function (a, b) { return b - a; }))
    .map(function (d) { return chipRow("dec:" + d, d === "all" ? "Any decade" : d + "s", f.decade === d); }).join("");
  var genChips = Object.keys(genres).sort()
    .map(function (g) { return chipRow("gen:" + g, g, !!f.genres[g]); }).join("");

  var shown = keys.filter(function (k) {
    var rec = mediaCache[k] || {}, mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
    if (f.type !== "all" && rec.kind !== f.type) return false;
    if (f.decade !== "all" && String(Math.floor((rec.year || 0) / 10) * 10) !== f.decade) return false;
    if (f.list === "both" && !(mi.shared && th.shared)) return false;
    if (f.list === "shared" && !mi.shared) return false;
    if (f.list === "solo" && !mi.solo) return false;
    if (f.list === "rated" && mi.rating == null) return false;
    if (f.list === "watched" && !mi.watched) return false;
    if (f.list === "note" && !mi.note) return false;
    var want = Object.keys(f.genres);
    if (want.length) {
      var have = rec.genres || [], hit = false;
      for (var i = 0; i < want.length; i++) if (have.indexOf(want[i]) >= 0) { hit = true; break; }
      if (!hit) return false;
    }
    return true;
  }).sort(function (a, b) {
    var ra = (state.mine[a] || blank()).rating, rb = (state.mine[b] || blank()).rating;
    if (ra == null && rb == null) return 0;
    if (ra == null) return 1;
    if (rb == null) return -1;
    return rb - ra;
  });

  el("pfBody").innerHTML =
    '<div id="filters">' + typeChips + listChips + "</div>" +
    '<div id="filters2" style="display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px">' + decChips + genChips + "</div>" +
    (shown.length
      ? '<div class="grid">' + shown.map(function (k) {
          var rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
          return '<div class="gcell" data-k="' + esc(k) + '">' +
            '<div class="gp" style="' + (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '">' +
            (mi.rating != null ? '<span class="gr">' + mi.rating.toFixed(1) + "</span>" : "") + "</div>" +
            '<div class="gt">' + esc(rec.title || k) + "</div></div>";
        }).join("") + "</div>"
      : '<p class="empty" style="padding:18px">Nothing matches these filters.</p>') +
    '<p class="credit" style="padding:12px 18px 0">' + shown.length + " of " + keys.length +
    " titles you have touched. Genres match as OR — any one of them is enough.</p>";

  Array.prototype.forEach.call(el("prof").querySelectorAll(".fch"), function (node) {
    node.onclick = function () {
      var parts = node.dataset.f.split(":"), kind = parts[0], val = parts.slice(1).join(":");
      if (kind === "type") libFilter.type = val;
      else if (kind === "list") libFilter.list = val;
      else if (kind === "dec") libFilter.decade = val;
      else if (kind === "gen") {
        if (libFilter.genres[val]) delete libFilter.genres[val];
        else libFilter.genres[val] = 1;
      }
      renderLibrary();
    };
  });
  bindTiles();
}

function renderSettings() {
  el("pfBody").innerHTML =
    '<div style="padding:0 18px">' +
    '<p class="msg">Worker: ' + (worker ? esc(worker) : "not set — TVMaze and MyAnimeList only") + "</p>" +
    '<label class="f" for="wk">Cloudflare worker URL</label>' +
    '<input class="f" id="wk" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
      'spellcheck="false" value="' + esc(worker) + '">' +
    '<div><button class="f" id="wkSave">Save and test</button>' +
    '<button class="f g" id="swap">Switch person</button></div>' +
    '<p class="credit">Your TMDB token lives as a secret on the worker, never in this page. ' +
    'Data from TVMaze (CC BY-SA), MyAnimeList via Jikan, and TMDB. ' +
    "This product uses the TMDB API but is not endorsed or certified by TMDB.</p></div>";
  el("wkSave").onclick = function () {
    var v = (el("wk").value || "").trim().replace(/\/+$/, "");
    if (v && !/^https:\/\/[^\s]+$/.test(v)) { alert("Not an https URL."); return; }
    el("wkSave").textContent = "Testing…";
    (v ? getJSON(v + "/tmdb/configuration") : Promise.resolve()).then(function () {
      worker = v;
      try { localStorage.setItem(K_WORKER, v || "none"); } catch (e) {}
      location.reload();
    }).catch(function () { el("wkSave").textContent = "Failed — check the worker"; });
  };
  el("swap").onclick = function () {
    try { localStorage.removeItem(K_ME); } catch (e) {}
    location.reload();
  };
}

function openProfile() {
  if (!state.me) return;
  el("pfAv").textContent = state.me.initial;
  el("pfAv").style.background = state.me.bar_colour;
  el("pfNm").textContent = state.me.display_name;
  el("prof").classList.add("on");
  el("pfBody").innerHTML = '<p class="msg" style="padding:0 18px">Loading…</p>';
  Promise.all([loadTiers(), loadMediaRows(touchedKeys())]).then(function () { paintProfile(); });
}
function paintProfile() {
  Array.prototype.forEach.call(el("pfTabs").querySelectorAll(".tab"), function (n) {
    n.className = "tab" + (n.dataset.t === pfTab ? " on" : "");
  });
  if (pfTab === "tiers") renderTiers();
  else if (pfTab === "library") renderLibrary();
  else renderSettings();
}
Array.prototype.forEach.call(el("pfTabs").querySelectorAll(".tab"), function (n) {
  n.onclick = function () { pfTab = n.dataset.t; paintProfile(); };
});
function setNav(which) {
  ["nvLists", "nvFeed", "nvLog", "nvMe"].forEach(function (id) {
    el(id).className = "nv" + (id === which ? " on" : "");
  });
}
el("pfX").onclick = function () { el("prof").classList.remove("on"); setNav("nvFeed"); counts(); };
el("nvMe").onclick = function () { setNav("nvMe"); openProfile(); };
el("nvLists").onclick = function () { setNav("nvLists"); showList(listMode); };
el("nvLog").onclick = function () { setNav("nvLog"); openSearch(); };
el("nvFeed").onclick = function () {
  setNav("nvFeed");
  closeSheet();
  el("prof").classList.remove("on");
};

/* ------------------------------------------------------------------ gate */

function showGate() {
  var btns = state.users.map(function (u) {
    return '<button class="who-btn" data-id="' + esc(u.id) + '">' +
      '<span class="av" style="background:' + esc(u.bar_colour) + '">' + esc(u.initial) + "</span>" +
      '<span class="nm">' + esc(u.display_name) + "</span></button>";
  }).join("");
  el("gate").innerHTML = "<h3>Who's swiping?</h3>" +
    "<p>Stored on this device. Switch any time from your profile.</p>" + btns;
  el("gate").classList.add("on");
  el("load").classList.add("off");
  Array.prototype.forEach.call(el("gate").querySelectorAll(".who-btn"), function (node) {
    node.onclick = function () {
      state.me = state.users.filter(function (x) { return x.id === node.dataset.id; })[0];
      try { localStorage.setItem(K_ME, JSON.stringify(state.me)); } catch (e) {}
      el("gate").classList.remove("on");
      el("load").classList.remove("off");
      afterIdentity();
    };
  });
}

/* ------------------------------------------- one-time local swipe import */

function importLegacy() {
  var raw;
  try { raw = localStorage.getItem(K_LEGACY); } catch (e) { return Promise.resolve(false); }
  if (!raw) return Promise.resolve(false);
  var old;
  try { old = JSON.parse(raw); } catch (e) { return Promise.resolve(false); }
  var jobs = [];
  ["shared", "solo"].forEach(function (b) {
    Object.keys(old[b] || {}).forEach(function (k) {
      jobs.push({ key: k, kind: b === "shared" ? "playlist_shared" : "playlist_solo", v: old[b][k] });
    });
  });
  if (!jobs.length) { try { localStorage.removeItem(K_LEGACY); } catch (e) {} return Promise.resolve(false); }
  var mediaRows = {}, inter = [];
  jobs.forEach(function (j) {
    mediaRows[j.key] = { key: j.key, source: j.key.split(":")[0], kind: j.v.kind || "movie",
      title: j.v.title || j.key, year: j.v.year || null, poster: null };
    inter.push({ user_id: state.me.id, media_key: j.key, kind: j.kind, value: null });
  });
  return sbUpsert("media", Object.keys(mediaRows).map(function (k) { return mediaRows[k]; }), "key")
    .then(function () { return sbUpsert("interaction", inter, "user_id,media_key,kind"); })
    .then(function () { try { localStorage.removeItem(K_LEGACY); } catch (e) {} return true; })
    .catch(function () { return false; });
}

/* ------------------------------------------------------------------ boot */

var booted = false;

function failScreen(headline) {
  if (booted) return;
  var order = ["db", "genres", "movies", "shows", "tvmaze", "anime"];
  var lines = order.filter(function (k) { return state.diag[k]; })
    .map(function (k) { return k + " — " + esc(state.diag[k]); });
  el("load").innerHTML =
    '<p style="font-size:14px;color:#cfcdc5;text-align:center;padding:0 32px;line-height:1.6">' + esc(headline) + "</p>" +
    (lines.length ? '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px;line-height:1.8;font-family:ui-monospace,monospace">' + lines.join("<br>") + "</p>"
      : '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px">No source reported an error, which usually means the requests never returned.</p>') +
    '<div style="display:flex;gap:8px;margin-top:4px"><button class="f" id="btnRetry">Retry</button>' +
    '<button class="f g" id="btnNoTmdb">Run without TMDB</button></div>';
  el("btnRetry").onclick = function () { location.reload(); };
  el("btnNoTmdb").onclick = function () {
    try { localStorage.setItem(K_WORKER, "none"); } catch (e) {}
    location.reload();
  };
}

var K_COACH = "reel.coach";

function maybeCoach() {
  var seen;
  try { seen = localStorage.getItem(K_COACH); } catch (e) { seen = "1"; }
  if (seen) return;
  el("coach").classList.add("on");
  el("coachOk").onclick = function () {
    el("coach").classList.remove("on");
    try { localStorage.setItem(K_COACH, "1"); } catch (e) {}
  };
}

function reconcileWatched() {
  if (!state.me) return Promise.resolve();
  var rows = [];
  state.ratings.forEach(function (r) {
    var mi = state.mine[r.key];
    if (mi && !mi.watched) {
      mi.watched = true;
      rows.push({ user_id: state.me.id, media_key: r.key, kind: "watched", value: null });
    }
  });
  if (!rows.length) return Promise.resolve();
  return sbUpsert("interaction", rows, "user_id,media_key,kind").catch(function () {});
}

/* ------------------------------------------------- cached first paint */

var K_FEED = "reel.feed";

function cacheFeed() {
  try {
    var from = Math.max(0, state.i - 2);
    var slim = state.queue.slice(from, from + 24).map(function (it) {
      return { key: it.key, source: it.source, sourceKind: it.sourceKind, sourceId: it.sourceId,
        kind: it.kind, title: it.title, tagline: it.tagline, year: it.year, poster: it.poster,
        genres: it.genres || [], _gids: it._gids || null, runtime: it.runtime,
        descShort: it.descShort, descLong: it.descLong, thin: it.thin, imdb: it.imdb,
        ratings: it.ratings || {}, extra: it.extra };
    });
    localStorage.setItem(K_FEED, JSON.stringify({ i: state.i - from, q: slim }));
  } catch (e) {}
}

function readFeedCache() {
  try {
    var r = localStorage.getItem(K_FEED);
    if (!r) return null;
    var o = JSON.parse(r);
    if (!o || !o.q || !o.q.length) return null;
    return o;
  } catch (e) { return null; }
}

/* ------------------------------------------------------------------ boot */

var pFeed = null;

function startData() {
  if (!state.me) return Promise.resolve();
  return loadMine()
    .then(importLegacy)
    .then(function (did) { return did ? loadMine() : null; })
    .then(loadTiers)
    .then(reconcileWatched)
    .then(function () {
      counts();
      var cu = current();
      if (cu) refreshChrome(cu);
    })
    .catch(function () {});
}

function liftOff() {
  if (booted || !state.queue.length) return;
  booted = true;
  renderWindow();
  maybeCoach();
  cacheFeed();
}

function afterIdentity() {
  el("navAv").textContent = state.me.initial;
  el("navAv").style.background = state.me.bar_colour;
  startData();
  if (state.queue.length) { liftOff(); return; }
  if (pFeed) pFeed.then(function () {
    if (state.queue.length) liftOff();
    else if (!booted) failScreen("No source returned anything.");
  });
}

function boot() {
  el("navAv").textContent = state.me ? state.me.initial : "?";
  el("navAv").style.background = state.me ? state.me.bar_colour : "#333";

  // Paint the last session's feed on the first frame. No network is touched
  // before this, so the loader is gone before the first request lands.
  if (state.me) {
    var c = readFeedCache();
    if (c) {
      state.queue = c.q;
      state.i = Math.max(0, Math.min(c.i || 0, c.q.length - 1));
      booted = true;
      renderWindow();
    }
  }
  if (!booted) setTimeout(function () { failScreen("Timed out waiting for the sources."); }, 16000);

  // Identity and the feed are independent, so they run at the same time.
  pFeed = refill();
  pFeed.then(function () { backfillGenres(); cacheFeed(); });

  sbGet("app_user?select=id,handle,display_name,initial,bar_colour&order=created_at")
    .then(function (rows) {
      state.users = rows || [];
      if (!state.users.length) {
        if (!booted) failScreen("No people in the database. Run the seed in schema.sql.");
        return;
      }
      if (state.me) {
        var still = state.users.filter(function (u) { return u.id === state.me.id; })[0];
        if (still) { state.me = still; afterIdentity(); return; }
      }
      showGate();
    })
    .catch(function (e) {
      state.diag.db = e.message;
      if (!booted) failScreen("Could not reach Supabase.");
    });
}

boot();
</script>
