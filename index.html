<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0c;color:#f2f1ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden}
.card{position:absolute;inset:0;display:flex;flex-direction:column;
  will-change:transform;touch-action:none}
.poster{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#17171b}
.scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,12,.97) 0%,rgba(10,10,12,.92) 26%,rgba(10,10,12,.45) 52%,rgba(10,10,12,.15) 72%,rgba(10,10,12,.55) 100%)}
.body{position:relative;margin-top:auto;padding:0 20px calc(92px + env(safe-area-inset-bottom)) 20px;
  max-height:72%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5dcaa5;margin-bottom:7px}
h1{font-size:27px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.tag{font-size:13px;color:#8d8b83;margin-top:6px;font-style:italic}
.meta{font-size:13px;color:#9a988f;margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}
.meta span:not(:last-child)::after{content:"·";margin-left:8px;color:#55544e}
.short{font-size:15.5px;line-height:1.52;margin-top:15px;color:#e4e2dc}
.long{font-size:14px;line-height:1.66;margin-top:13px;color:#a8a69d}
.long p{margin-bottom:10px}
.samenote{font-size:11.5px;color:#6a6963;margin-top:10px;font-style:italic}
.seasons{display:flex;gap:10px;overflow-x:auto;margin-top:18px;padding-bottom:6px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.seasons::-webkit-scrollbar{display:none}
.season{flex:0 0 112px;scroll-snap-align:start;cursor:pointer}
.season .sp{width:112px;height:160px;border-radius:9px;background:#1d1d22;
  background-size:cover;background-position:center}
.season .sn{font-size:12px;margin-top:6px;font-weight:500}
.season .se{font-size:11px;color:#85837b;margin-top:1px}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;
  border-radius:50%;background:rgba(18,18,22,.72);backdrop-filter:blur(14px);
  border:.5px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:6}
#cLeft{left:14px}#cRight{right:14px}
.corner svg{width:19px;height:19px;stroke:#e8e6e0;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:7;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom)) 16px;
  background:linear-gradient(to top,rgba(10,10,12,.96),rgba(10,10,12,0));
  display:flex;align-items:center;gap:9px}
.pill{font-size:12px;padding:6px 12px;border-radius:999px;border:.5px solid rgba(255,255,255,.16);
  background:rgba(22,22,26,.75);color:#cfcdc5;cursor:pointer;white-space:nowrap}
.pill b{font-weight:600;color:#fff}
.pill.sh{border-color:rgba(93,202,165,.55)}
.pill.so{border-color:rgba(175,169,236,.55)}
.pill.cog{padding:6px 10px;margin-left:auto}
.flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  letter-spacing:.02em;transition:opacity .16s}
.flash.on{opacity:1}
.flash.sh{background:rgba(29,158,117,.26);color:#9fe1cb}
.flash.so{background:rgba(127,119,221,.26);color:#cecbf6}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:84%;z-index:12;
  background:#131317;border-radius:18px 18px 0 0;border-top:.5px solid rgba(255,255,255,.1);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#shHead{padding:16px 20px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:.5px solid rgba(255,255,255,.08)}
#shHead h2{font-size:16px;font-weight:600;flex:1}
#shClose{font-size:22px;color:#85837b;cursor:pointer;line-height:1;padding:0 4px}
#shBody{padding:8px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;opacity:0;
  pointer-events:none;transition:opacity .22s}
#veil.on{opacity:1;pointer-events:auto}
.crow{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.crow img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#22222a;flex:0 0 42px}
.crow .ph{width:42px;height:42px;border-radius:50%;background:#22222a;flex:0 0 42px}
.crow .nm{font-size:14.5px;font-weight:500}
.crow .ch{font-size:12.5px;color:#908e86;margin-top:1px}
.crow .rk{font-size:11px;color:#55544e;margin-left:auto;font-variant-numeric:tabular-nums}
.rrow{display:flex;align-items:baseline;gap:10px;padding:12px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.rrow .src{font-size:13.5px;color:#cfcdc5;flex:1}
.rrow .val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rrow .abs{font-size:12.5px;color:#55544e;font-style:italic}
.rrow .sub{font-size:11px;color:#6a6963;margin-top:2px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.lbar{width:3px;height:34px;flex:0 0 3px;display:flex;flex-direction:column;overflow:hidden}
.lbar i{flex:1}
.lrow .lt{font-size:14px;flex:1}
.lrow .ly{font-size:12px;color:#6a6963}
.chip{font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px}
.chip.sh{background:rgba(29,158,117,.2);color:#9fe1cb}
.chip.so{background:rgba(127,119,221,.2);color:#cecbf6}
label.f{display:block;font-size:12px;color:#908e86;margin:16px 0 6px}
input.f{width:100%;padding:11px 13px;border-radius:9px;background:#1b1b21;color:#f2f1ee;
  border:.5px solid rgba(255,255,255,.14);font-size:14px;font-family:inherit}
input.f:focus{outline:none;border-color:#5dcaa5}
button.f{margin-top:14px;padding:11px 18px;border-radius:9px;background:#1d9e75;color:#04342c;
  border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
button.g{background:transparent;color:#cfcdc5;border:.5px solid rgba(255,255,255,.18);
  margin-left:8px;font-weight:500}
.msg{font-size:12.5px;margin-top:10px;line-height:1.55}
.msg.bad{color:#f09595}
.msg.good{color:#9fe1cb}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:20;background:#0a0a0c;transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#load .ring{width:34px;height:34px;border-radius:50%;border:2px solid #2a2a32;
  border-top-color:#5dcaa5;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{font-size:13px;color:#6a6963}
.credit{font-size:11px;color:#4a4945;line-height:1.6;margin-top:16px}
@media (prefers-reduced-motion:reduce){.card{transition:none!important}}
</style>

<body>

<div id="stage"></div>

<div class="corner" id="cLeft" role="button" aria-label="Cast">
  <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c0-3.6 2.9-5.6 6.4-5.6s6.4 2 6.4 5.6"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6.1"/><path d="M18.6 14.8c2 .7 3.4 2.3 3.4 5.2"/></svg>
</div>
<div class="corner" id="cRight" role="button" aria-label="Ratings">
  <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>
</div>

<div id="bar">
  <div class="pill sh" id="pSh">Shared <b>0</b></div>
  <div class="pill so" id="pSo">Only me <b>0</b></div>
  <div class="pill cog" id="pCog" role="button" aria-label="Settings">···</div>
</div>

<div class="flash" id="flash"></div>
<div id="veil"></div>
<div id="sheet">
  <div id="shHead"><h2>—</h2><div id="shClose" role="button" aria-label="Close">×</div></div>
  <div id="shBody"></div>
</div>

<div id="load"><div class="ring"></div><p>Loading the feed</p></div>

<script>
"use strict";

var K_STATE = "reel.v0";
var K_WORKER = "reel.worker";
var DEFAULT_WORKER = "https://mediaorg.d86532an.workers.dev";
var IMG = "https://image.tmdb.org/t/p/w780";
var IMG_S = "https://image.tmdb.org/t/p/w185";

var state = { queue: [], i: 0, shared: {}, solo: {}, detail: {}, busy: false, genres: {} };
var worker = DEFAULT_WORKER;

try {
  var raw = localStorage.getItem(K_STATE);
  if (raw) { var s = JSON.parse(raw); state.shared = s.shared || {}; state.solo = s.solo || {}; }
  var w = localStorage.getItem(K_WORKER);
  worker = (w === "none" ? "" : (w || DEFAULT_WORKER)).replace(/\/+$/, "");
} catch (e) {}

function save() {
  try { localStorage.setItem(K_STATE, JSON.stringify({ shared: state.shared, solo: state.solo })); }
  catch (e) {}
}
function saveWorker(u) {
  worker = (u || "").replace(/\/+$/, "");
  try { localStorage.setItem(K_WORKER, worker || "none"); }
  catch (e) {}
}

function el(id) { return document.getElementById(id); }
function rnd(n) { return Math.floor(Math.random() * n); }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function strip(html) {
  if (!html) return "";
  var d = document.createElement("div");
  d.innerHTML = html;
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function clip(txt, max) {
  if (!txt) return "";
  if (txt.length <= max) return txt;
  var cut = txt.slice(0, max);
  var dot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (dot > max * 0.45) return cut.slice(0, dot + 1);
  var sp = cut.lastIndexOf(" ");
  return (sp > 0 ? cut.slice(0, sp) : cut) + "…";
}
function paras(txt) {
  if (!txt) return [];
  var sents = txt.match(/[^.!?]+[.!?]+(\s|$)/g);
  if (!sents || sents.length < 4) return [txt];
  var mid = Math.ceil(sents.length / 2);
  return [sents.slice(0, mid).join("").trim(), sents.slice(mid).join("").trim()];
}
function getJSON(url) {
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.json();
  });
}

/* ---------- throttles ---------- */

function gate(ms) {
  var last = 0;
  return function () {
    var wait = Math.max(0, ms - (Date.now() - last));
    last = Date.now() + wait;
    return new Promise(function (r) { setTimeout(r, wait); });
  };
}
var gTmdb = gate(260);   // 40 req / 10 s
var gJikan = gate(420);  // 3 req / s

function tmdb(path, params) {
  if (!worker) return Promise.reject(new Error("no worker"));
  var q = new URLSearchParams(params || {}).toString();
  return gTmdb().then(function () {
    return getJSON(worker + "/tmdb/" + path + (q ? "?" + q : ""));
  });
}

/* ---------- adapters: every source normalises to one shape ---------- */

function genreNames(ids, kind) {
  var map = state.genres[kind] || {};
  return (ids || []).map(function (id) { return map[id]; }).filter(Boolean);
}

function fromTmdbMovie(m) {
  var full = (m.overview || "").trim();
  return {
    key: "tmdb:movie:" + m.id, source: "tmdb", sourceKind: "movie", sourceId: m.id,
    kind: "movie",
    title: m.title || m.original_title,
    tagline: null,
    year: m.release_date ? parseInt(m.release_date.slice(0, 4), 10) : null,
    poster: m.poster_path ? IMG + m.poster_path : null,
    genres: genreNames(m.genre_ids, "movie"),
    runtime: null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: null,
    ratings: { tmdb: m.vote_average ? Math.round(m.vote_average * 10) / 10 : null,
               tmdbVotes: m.vote_count || null },
    extra: null
  };
}

function fromTmdbTv(t) {
  var full = (t.overview || "").trim();
  return {
    key: "tmdb:tv:" + t.id, source: "tmdb", sourceKind: "tv", sourceId: t.id,
    kind: "show",
    title: t.name || t.original_name,
    tagline: null,
    year: t.first_air_date ? parseInt(t.first_air_date.slice(0, 4), 10) : null,
    poster: t.poster_path ? IMG + t.poster_path : null,
    genres: genreNames(t.genre_ids, "tv"),
    runtime: null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: null,
    ratings: { tmdb: t.vote_average ? Math.round(t.vote_average * 10) / 10 : null,
               tmdbVotes: t.vote_count || null },
    extra: null
  };
}

function fromTvmaze(s) {
  var full = strip(s.summary);
  return {
    key: "tvmaze:" + s.id, source: "tvmaze", sourceId: s.id,
    kind: "show",
    title: s.name, tagline: null,
    year: s.premiered ? parseInt(s.premiered.slice(0, 4), 10) : null,
    poster: s.image ? (s.image.original || s.image.medium) : null,
    genres: s.genres || [],
    runtime: s.averageRuntime || s.runtime || null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: s.externals ? s.externals.imdb : null,
    ratings: { tvmaze: s.rating && s.rating.average ? s.rating.average : null },
    extra: s.network ? s.network.name : (s.webChannel ? s.webChannel.name : null)
  };
}

function fromJikan(a) {
  var full = (a.synopsis || "").replace(/\s*\[Written by MAL Rewrite\]\s*/i, "").trim();
  return {
    key: "mal:" + a.mal_id, source: "mal", sourceId: a.mal_id,
    kind: a.type === "Movie" ? "anime film" : "anime",
    title: a.title_english || a.title, tagline: null,
    year: a.year || (a.aired && a.aired.from ? parseInt(a.aired.from.slice(0, 4), 10) : null),
    poster: a.images && a.images.jpg ? (a.images.jpg.large_image_url || a.images.jpg.image_url) : null,
    genres: (a.genres || []).map(function (g) { return g.name; }),
    runtime: null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: null,
    ratings: { mal: a.score || null, malVotes: a.scored_by || null },
    extra: a.episodes ? a.episodes + " episodes" : null
  };
}

/* ---------- pools ---------- */

function loadGenres() {
  if (!worker || state.genres.movie) return Promise.resolve();
  return Promise.all([tmdb("genre/movie/list"), tmdb("genre/tv/list")])
    .then(function (r) {
      state.genres.movie = {};
      state.genres.tv = {};
      (r[0].genres || []).forEach(function (g) { state.genres.movie[g.id] = g.name; });
      (r[1].genres || []).forEach(function (g) { state.genres.tv[g.id] = g.name; });
    })
    .catch(function () {});
}

function loadTmdbMovies() {
  return tmdb("discover/movie", {
    sort_by: "popularity.desc", page: 1 + rnd(45),
    "vote_count.gte": 400, include_adult: false, language: "en-US"
  }).then(function (d) {
    return (d.results || []).filter(function (m) { return m.poster_path && m.overview; }).map(fromTmdbMovie);
  }).catch(function () { return []; });
}

function loadTmdbShows() {
  return tmdb("discover/tv", {
    sort_by: "popularity.desc", page: 1 + rnd(30),
    "vote_count.gte": 150, include_adult: false, language: "en-US"
  }).then(function (d) {
    return (d.results || []).filter(function (t) { return t.poster_path && t.overview; }).map(fromTmdbTv);
  }).catch(function () { return []; });
}

function loadTvmaze() {
  return getJSON("https://api.tvmaze.com/shows?page=" + rnd(180)).then(function (arr) {
    return arr.filter(function (s) {
      return s.image && s.summary && s.rating && s.rating.average >= 6.8;
    }).map(fromTvmaze);
  }).catch(function () { return []; });
}

function loadAnime() {
  return gJikan()
    .then(function () { return getJSON("https://api.jikan.moe/v4/top/anime?page=" + (1 + rnd(14)) + "&limit=25"); })
    .then(function (j) {
      return (j.data || []).filter(function (a) { return a.synopsis && a.images; }).map(fromJikan);
    }).catch(function () { return []; });
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function refill() {
  if (state.busy) return Promise.resolve();
  state.busy = true;
  return loadGenres().then(function () {
    var jobs = worker
      ? [loadTmdbMovies(), loadTmdbShows(), loadAnime()]
      : [loadTvmaze(), loadAnime()];
    return Promise.all(jobs);
  }).then(function (res) {
    var mixed = [];
    if (worker) {
      mixed = shuffle(res[0]).slice(0, 14)
        .concat(shuffle(res[1]).slice(0, 10))
        .concat(shuffle(res[2]).slice(0, 8));
    } else {
      mixed = shuffle(res[0]).slice(0, 26).concat(shuffle(res[1]).slice(0, 9));
    }
    var seen = {};
    state.queue.forEach(function (q) { seen[q.key] = 1; });
    mixed = mixed.filter(function (m) { return !seen[m.key]; });
    state.queue = state.queue.concat(shuffle(mixed));
    state.busy = false;
  }).catch(function () { state.busy = false; });
}

/* ---------- detail: cast and seasons ---------- */

function detailFor(item) {
  if (state.detail[item.key]) return Promise.resolve(state.detail[item.key]);
  var p;

  if (item.source === "tmdb") {
    p = tmdb(item.sourceKind + "/" + item.sourceId, { append_to_response: "credits,external_ids" })
      .then(function (d) {
        var cast = ((d.credits && d.credits.cast) || []).slice(0, 40).map(function (c) {
          return {
            name: c.name, character: c.character || "",
            img: c.profile_path ? IMG_S + c.profile_path : null,
            pop: c.popularity || 0, billing: (c.order == null ? 999 : c.order) + 1
          };
        });
        cast.sort(function (a, b) { return b.pop - a.pop; });
        cast = cast.slice(0, 24).map(function (c, n) { c.rank = n + 1; return c; });

        var seasons = (d.seasons || []).filter(function (s) { return s.season_number > 0; })
          .map(function (s) {
            return {
              number: s.season_number,
              name: s.name || ("Season " + s.season_number),
              poster: s.poster_path ? IMG_S + s.poster_path : null,
              episodes: s.episode_count,
              summary: (s.overview || "").trim(),
              year: s.air_date ? s.air_date.slice(0, 4) : null
            };
          });

        return {
          cast: cast, seasons: seasons,
          imdb: d.external_ids ? d.external_ids.imdb_id : null,
          tagline: d.tagline || null,
          runtime: d.runtime || (d.episode_run_time && d.episode_run_time[0]) || null,
          ranked: "popularity"
        };
      });

  } else if (item.source === "tvmaze") {
    p = getJSON("https://api.tvmaze.com/shows/" + item.sourceId + "?embed[]=cast&embed[]=seasons")
      .then(function (d) {
        var em = d._embedded || {};
        return {
          cast: (em.cast || []).slice(0, 24).map(function (c, n) {
            return {
              name: c.person ? c.person.name : "",
              character: c.character ? c.character.name : "",
              img: c.person && c.person.image ? c.person.image.medium : null,
              rank: n + 1, billing: n + 1
            };
          }),
          seasons: (em.seasons || []).filter(function (s) { return s.number; }).map(function (s) {
            return {
              number: s.number, name: s.name || ("Season " + s.number),
              poster: s.image ? (s.image.medium || s.image.original) : null,
              episodes: s.episodeOrder, summary: strip(s.summary),
              year: s.premiereDate ? s.premiereDate.slice(0, 4) : null
            };
          }),
          ranked: "billing"
        };
      });

  } else {
    p = gJikan()
      .then(function () { return getJSON("https://api.jikan.moe/v4/anime/" + item.sourceId + "/characters"); })
      .then(function (j) {
        var rows = (j.data || []).slice(0, 24).map(function (c, n) {
          var va = (c.voice_actors || []).filter(function (v) { return v.language === "Japanese"; })[0]
                 || (c.voice_actors || [])[0];
          return {
            name: va && va.person ? va.person.name : "(voice unknown)",
            character: c.character ? c.character.name : "",
            img: c.character && c.character.images ? c.character.images.jpg.image_url : null,
            rank: n + 1, billing: n + 1
          };
        });
        return { cast: rows, seasons: [], ranked: "favourites" };
      });
  }

  return p.then(function (d) { state.detail[item.key] = d; return d; })
    .catch(function () {
      var d = { cast: [], seasons: [], failed: true };
      state.detail[item.key] = d;
      return d;
    });
}

/* ---------- rendering ---------- */

function cardHTML(it) {
  var bits = [];
  if (it.year) bits.push("<span>" + it.year + "</span>");
  if (it.genres.length) bits.push("<span>" + esc(it.genres.slice(0, 3).join(", ")) + "</span>");
  if (it.runtime) bits.push("<span>" + it.runtime + " min</span>");
  if (it.extra) bits.push("<span>" + esc(it.extra) + "</span>");

  var longHTML = paras(it.descLong).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  var note = it.thin
    ? '<p class="samenote">This source publishes a single synopsis for this title, so the long description is the same text set out in full.</p>'
    : "";

  var mark = "";
  if (state.shared[it.key]) mark += '<span class="chip sh">Shared</span>';
  if (state.solo[it.key]) mark += '<span class="chip so">Only me</span>';

  return '<div class="poster" style="' +
      (it.poster ? "background-image:url('" + esc(it.poster) + "')" : "") + '"></div>' +
    '<div class="scrim"></div>' +
    '<div class="body">' +
      '<div class="kind">' + esc(it.kind) + '</div>' +
      "<h1>" + esc(it.title) + "</h1>" +
      '<div class="tag" id="tagLine"></div>' +
      '<div class="meta" id="metaLine">' + bits.join("") + "</div>" +
      (mark ? '<div style="margin-top:10px">' + mark + "</div>" : "") +
      '<p class="short">' + esc(it.descShort || "No synopsis available.") + "</p>" +
      '<div class="long">' + longHTML + "</div>" +
      note +
      '<div class="seasons" id="seasonStrip"></div>' +
    "</div>";
}

function paintDetail(it, d) {
  if (d.tagline) { var t = el("tagLine"); if (t) t.textContent = d.tagline; }
  if (d.runtime && !it.runtime) {
    it.runtime = d.runtime;
    var m = el("metaLine");
    if (m) m.insertAdjacentHTML("beforeend", "<span>" + d.runtime + " min</span>");
  }
  if (d.imdb) it.imdb = d.imdb;

  var strip = el("seasonStrip");
  if (!strip || !d.seasons || !d.seasons.length) return;
  strip.innerHTML = d.seasons.map(function (s, n) {
    return '<div class="season" data-s="' + n + '">' +
      '<div class="sp" style="' + (s.poster ? "background-image:url('" + esc(s.poster) + "')" : "") + '"></div>' +
      '<div class="sn">' + esc(s.name) + "</div>" +
      '<div class="se">' + (s.episodes ? s.episodes + " ep" : "") +
        (s.year ? (s.episodes ? " · " : "") + s.year : "") + "</div>" +
    "</div>";
  }).join("");
  Array.prototype.forEach.call(strip.querySelectorAll(".season"), function (node) {
    node.onclick = function () {
      var s = d.seasons[parseInt(node.dataset.s, 10)];
      openSheet(s.name, (s.episodes ? '<p class="msg">' + s.episodes + " episodes" +
        (s.year ? ", from " + s.year : "") + "</p>" : "") +
        '<p class="short" style="margin-top:12px">' +
        esc(s.summary || "No season synopsis from this source.") + "</p>" +
        '<p class="credit">Per-episode rating and notes arrive in V1.</p>');
    };
  });
}

var card = null;
function current() { return state.queue[state.i]; }

function render() {
  var it = current();
  if (!it) return;
  if (!card) {
    card = document.createElement("div");
    card.className = "card";
    el("stage").appendChild(card);
    bindGestures(card);
  }
  card.innerHTML = cardHTML(it);
  card.style.transition = "none";
  card.style.transform = "translate3d(0,0,0)";
  el("load").classList.add("off");

  detailFor(it).then(function (d) { if (current() === it) paintDetail(it, d); });

  if (state.queue.length - state.i < 8) refill();
  var nx = state.queue[state.i + 1];
  if (nx && nx.poster) { var im = new Image(); im.src = nx.poster; }
}

function advance(dir) {
  var ni = state.i + dir;
  if (ni < 0) { bounce(); return; }
  if (ni >= state.queue.length) {
    refill().then(function () {
      if (state.queue[ni]) { state.i = ni; render(); } else bounce();
    });
    return;
  }
  card.style.transition = "transform .22s cubic-bezier(.4,0,.6,1)";
  card.style.transform = "translate3d(0," + (dir > 0 ? "-100%" : "100%") + ",0)";
  setTimeout(function () { state.i = ni; render(); }, 210);
}

function bounce() {
  card.style.transition = "transform .18s ease-out";
  card.style.transform = "translate3d(0,-14px,0)";
  setTimeout(function () { card.style.transform = "translate3d(0,0,0)"; }, 170);
}

function collect(which) {
  var it = current();
  if (!it) return;
  (which === "sh" ? state.shared : state.solo)[it.key] =
    { title: it.title, year: it.year, kind: it.kind, at: Date.now() };
  save(); counts();
  var f = el("flash");
  f.className = "flash on " + which;
  f.textContent = which === "sh" ? "Added to shared" : "Added to only me";
  setTimeout(function () { f.className = "flash " + which; }, 460);
  card.style.transition = "transform .2s ease-out";
  card.style.transform = "translate3d(" + (which === "sh" ? "34%" : "-34%") + ",0,0)";
  setTimeout(function () { advance(1); }, 190);
}

function counts() {
  el("pSh").innerHTML = "Shared <b>" + Object.keys(state.shared).length + "</b>";
  el("pSo").innerHTML = "Only me <b>" + Object.keys(state.solo).length + "</b>";
}

/* ---------- gestures ---------- */

function bindGestures(node) {
  var sx = 0, sy = 0, dx = 0, dy = 0, drag = false, axis = null, scrolled = false;

  node.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    dx = dy = 0; drag = true; axis = null;
    var b = node.querySelector(".body");
    scrolled = b ? b.scrollTop > 2 : false;
    node.style.transition = "none";
  }, { passive: true });

  node.addEventListener("touchmove", function (e) {
    if (!drag) return;
    dx = e.touches[0].clientX - sx;
    dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      else return;
    }
    if (axis === "y" && scrolled) return;
    e.preventDefault();
    node.style.transform = axis === "x"
      ? "translate3d(" + dx + "px,0,0) rotate(" + (dx / 44) + "deg)"
      : "translate3d(0," + dy * 0.9 + "px,0)";
  }, { passive: false });

  node.addEventListener("touchend", function () {
    if (!drag) return;
    drag = false;
    var TH = 66;
    if (axis === "x" && Math.abs(dx) > TH) { collect(dx > 0 ? "sh" : "so"); return; }
    if (axis === "y" && !scrolled && Math.abs(dy) > TH) { advance(dy < 0 ? 1 : -1); return; }
    node.style.transition = "transform .2s cubic-bezier(.3,.9,.3,1)";
    node.style.transform = "translate3d(0,0,0)";
  }, { passive: true });
}

document.addEventListener("keydown", function (e) {
  if (el("sheet").classList.contains("on")) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "ArrowUp") advance(-1);
  else if (e.key === "ArrowDown") advance(1);
  else if (e.key === "ArrowRight") collect("sh");
  else if (e.key === "ArrowLeft") collect("so");
});

/* ---------- sheets ---------- */

function openSheet(title, html) {
  el("shHead").querySelector("h2").textContent = title;
  el("shBody").innerHTML = html;
  el("sheet").classList.add("on");
  el("veil").classList.add("on");
}
function closeSheet() {
  el("sheet").classList.remove("on");
  el("veil").classList.remove("on");
}
el("shClose").onclick = closeSheet;
el("veil").onclick = closeSheet;

el("cLeft").onclick = function () {
  var it = current(); if (!it) return;
  openSheet("Cast", '<p class="msg">Loading…</p>');
  detailFor(it).then(function (d) {
    if (!d.cast.length) {
      openSheet("Cast", '<p class="msg">No cast listed for this title at the source.</p>');
      return;
    }
    var rows = d.cast.map(function (c) {
      return '<div class="crow">' +
        (c.img ? '<img src="' + esc(c.img) + '" alt="">' : '<div class="ph"></div>') +
        "<div><div class='nm'>" + esc(c.name) + "</div>" +
        (c.character ? "<div class='ch'>as " + esc(c.character) + "</div>" : "") + "</div>" +
        "<div class='rk'>" + c.rank + "</div></div>";
    }).join("");
    var how = d.ranked === "popularity"
      ? "Ranked by TMDB person popularity, not billing order."
      : d.ranked === "favourites"
        ? "Characters in MyAnimeList favourite order, with the Japanese voice actor."
        : "Ordered by billing, which is all this source exposes.";
    openSheet("Cast", rows + '<p class="credit">' + how + "</p>");
  });
};

el("cRight").onclick = function () {
  var it = current(); if (!it) return;
  var rows = [];
  function row(src, val, sub, scale) {
    rows.push('<div class="rrow"><div class="src">' + src +
      (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" +
      (val == null
        ? '<div class="abs">not available</div>'
        : '<div class="val">' + val + '<span style="font-size:12px;color:#6a6963">' + scale + "</span></div>") +
      "</div>");
  }
  if (it.source === "tmdb") {
    row("TMDB", it.ratings.tmdb, it.ratings.tmdbVotes ? it.ratings.tmdbVotes.toLocaleString() + " votes" : "", "/10");
  }
  if (it.source === "tvmaze") row("TVMaze", it.ratings.tvmaze, "community average", "/10");
  if (it.source === "mal") {
    row("MyAnimeList", it.ratings.mal, it.ratings.malVotes ? it.ratings.malVotes.toLocaleString() + " votes" : "", "/10");
  }
  row("IMDb", null, it.imdb ? it.imdb + " — rating needs the nightly dump" : "no id from this source", "/10");
  row("Metacritic", null, "needs an OMDb key", "/100");
  row("Letterboxd", null, "API access requested", "/5");
  row("Rotten Tomatoes", null, "agent fetch, once you interact", "%");
  row("Ours", null, "rate it in V0.5", "/5");
  openSheet("Ratings", rows.join("") +
    '<p class="credit">Absent is a real state, not an error. Each row fills in as its source comes online, and nothing here blocks the feed.</p>');
};

function listSheet(which) {
  var bucket = which === "sh" ? state.shared : state.solo;
  var keys = Object.keys(bucket).sort(function (a, b) { return bucket[b].at - bucket[a].at; });
  if (!keys.length) {
    openSheet(which === "sh" ? "Shared" : "Only me",
      '<p class="msg">Nothing here yet. Swipe ' + (which === "sh" ? "right" : "left") + " to add.</p>");
    return;
  }
  var rows = keys.map(function (k) {
    var v = bucket[k], both = state.shared[k] && state.solo[k];
    return '<div class="lrow"><div class="lbar">' +
      (both ? '<i style="background:#1D9E75"></i><i style="background:#7F77DD"></i>'
            : '<i style="background:' + (which === "sh" ? "#1D9E75" : "#7F77DD") + '"></i>') +
      "</div><div class='lt'>" + esc(v.title) + "</div><div class='ly'>" + (v.year || "") + "</div></div>";
  }).join("");
  openSheet(which === "sh" ? "Shared" : "Only me", rows +
    '<p class="credit">Local to this device in V0. Two-person shared state lands with the database at V0.5.</p>');
}
el("pSh").onclick = function () { listSheet("sh"); };
el("pSo").onclick = function () { listSheet("so"); };

/* ---------- settings ---------- */

function settingsSheet(msg) {
  var active = worker
    ? '<p class="msg good">Connected: ' + esc(worker) + "</p>"
    : '<p class="msg">Not set. The feed is running on TVMaze and MyAnimeList, so there are no movies in it yet.</p>';
  openSheet("Settings",
    active +
    '<label class="f" for="wk">Cloudflare worker URL</label>' +
    '<input class="f" id="wk" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
      'spellcheck="false" placeholder="https://reel-proxy.yourname.workers.dev" value="' + esc(worker) + '">' +
    '<div><button class="f" id="wkSave">Save and test</button>' +
    (worker ? '<button class="f g" id="wkClear">Remove</button>' : "") + "</div>" +
    (msg || "") +
    '<p class="credit">Your TMDB token lives as a secret on the worker, never in this page. ' +
    'The worker URL is not a secret. Data from TVMaze (CC BY-SA), MyAnimeList via Jikan, and TMDB. ' +
    'This product uses the TMDB API but is not endorsed or certified by TMDB.</p>');

  el("wkSave").onclick = function () {
    var v = (el("wk").value || "").trim().replace(/\/+$/, "");
    if (!/^https:\/\/[^\s]+$/.test(v)) {
      settingsSheet('<p class="msg bad">That does not look like an https URL.</p>');
      return;
    }
    el("wkSave").textContent = "Testing…";
    getJSON(v + "/tmdb/configuration").then(function () {
      saveWorker(v);
      state.queue = []; state.i = 0; state.detail = {}; state.genres = {};
      el("load").classList.remove("off");
      el("load").querySelector("p").textContent = "Reloading with TMDB";
      closeSheet();
      refill().then(function () { if (state.queue.length) render(); });
    }).catch(function (e) {
      settingsSheet('<p class="msg bad">The worker answered with an error. Check that TMDB_TOKEN is set ' +
        "as a secret and that ALLOWED_ORIGIN permits this page.</p>");
    });
  };

  if (worker && el("wkClear")) {
    el("wkClear").onclick = function () {
      saveWorker("");
      state.queue = []; state.i = 0; state.detail = {}; state.genres = {};
      closeSheet();
      el("load").classList.remove("off");
      refill().then(function () { if (state.queue.length) render(); });
    };
  }
}
el("pCog").onclick = function () { settingsSheet(); };

/* ---------- boot ---------- */

counts();
refill().then(function () {
  if (!state.queue.length) {
    el("load").innerHTML = '<p style="font-size:14px;color:#908e86;text-align:center;padding:0 32px;line-height:1.6">' +
      "No sources answered.<br>Check the connection, then reload.</p>";
    return;
  }
  render();
});
</script>
</body>
</html>
