<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel">
<link rel="manifest" href='data:application/json,{"name":"Reel","short_name":"Reel","start_url":".","display":"standalone","background_color":"%230a0a0c","theme_color":"%230a0a0c","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 fill=%27%230a0a0c%27/%3E%3Ccircle cx=%2796%27 cy=%2796%27 r=%2742%27 fill=%27none%27 stroke=%27%235dcaa5%27 stroke-width=%2710%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0c;color:#f2f1ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden}

#track{position:absolute;inset:0;will-change:transform;touch-action:none;
  transform:translate3d(0,0,0)}
#track.anim{transition:transform .32s cubic-bezier(.19,.72,.26,1)}
.card{position:absolute;left:0;right:0;height:100%;will-change:transform;
  backface-visibility:hidden;transform:translate3d(0,0,0);overflow:hidden}
.card.s0{top:-100%}
.card.s1{top:0}
.card.s2{top:100%}
.card.anim{transition:transform .26s cubic-bezier(.22,.61,.36,1)}
.poster{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#17171b;transform:translateZ(0)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,12,.97) 0%,rgba(10,10,12,.9) 24%,rgba(10,10,12,.4) 48%,rgba(10,10,12,.12) 70%,rgba(10,10,12,.5) 100%)}

.body{position:absolute;left:0;right:0;bottom:0;
  padding:0 80px calc(74px + env(safe-area-inset-bottom)) 20px}
.kind{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5dcaa5;
  margin-bottom:7px;font-weight:600;opacity:.9}
h1{font-size:24px;line-height:1.18;font-weight:600;letter-spacing:-.022em}
.tag{font-size:13px;color:#8d8b83;margin-top:5px;font-style:italic}
.meta{font-size:12.5px;color:#9a988f;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.meta span:not(:last-child)::after{content:"·";margin-left:8px;color:#55544e}
.chips{margin-top:9px}
.chips:empty{display:none;margin-top:0}
.chip{font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px;display:inline-block}

.desc{position:relative;margin-top:12px;max-height:25vh;overflow:hidden;
  transition:max-height .24s ease}
.desc.open{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:4px;touch-action:pan-y;overscroll-behavior:contain}
.desc::-webkit-scrollbar{width:3px}
.desc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:2px}
.short{font-size:15px;line-height:1.5;color:#e4e2dc}
.long{font-size:13.5px;line-height:1.62;margin-top:12px;color:#a8a69d;display:none}
.desc.open .long{display:block}
.long p{margin-bottom:9px}
.samenote{font-size:11.5px;color:#6a6963;margin-top:9px;font-style:italic;display:none}
.desc.open .samenote{display:block}
.fade{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,12,.95),rgba(10,10,12,0))}
.desc.open .fade{display:none}
.more{display:inline-block;margin-top:7px;font-size:13px;color:#9a988f;cursor:pointer;
  font-weight:500;padding:3px 0}

.seasons{display:none;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:4px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x;
  overscroll-behavior:contain}
.desc.open .seasons.has{display:flex}
.seasons::-webkit-scrollbar{display:none}
.seasonsLbl{display:none;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#6a6963;margin-top:18px;font-weight:600}
.desc.open .seasonsLbl.has{display:block}
.season{flex:0 0 92px;scroll-snap-align:start;cursor:pointer}
.season .sp{width:92px;height:132px;border-radius:8px;background:#1d1d22;
  background-size:cover;background-position:center}
.season .sn{font-size:11.5px;margin-top:5px;font-weight:500}
.season .se{font-size:10.5px;color:#85837b;margin-top:1px}

.corner{position:fixed;top:calc(12px + env(safe-area-inset-top));width:38px;height:38px;
  border-radius:50%;background:rgba(14,14,18,.46);backdrop-filter:blur(16px);
  border:.5px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:6;transition:background .15s}
.corner:active{background:rgba(14,14,18,.8)}
#cLeft{left:16px}#cRight{right:16px}
.corner svg{width:18px;height:18px;stroke:#d8d6d0;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

#rail{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;
  display:flex;flex-direction:column;gap:21px;align-items:center}
.act{width:46px;height:46px;border-radius:50%;background:rgba(14,14,18,.46);
  backdrop-filter:blur(16px);border:.5px solid rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:background .15s,border-color .2s}
.act:active{background:rgba(14,14,18,.84);transform:scale(.94)}
.act svg{width:21px;height:21px;stroke:#d8d6d0;fill:none;stroke-width:1.65;
  stroke-linecap:round;stroke-linejoin:round}
.act.on{border-color:rgba(93,202,165,.75);background:rgba(29,158,117,.16)}
.act.on svg{stroke:#5dcaa5}
.act .lbl{position:absolute;bottom:-13px;font-size:9.5px;color:#7e7c75;white-space:nowrap;
  letter-spacing:.02em}
.act.on .lbl{color:#5dcaa5;font-weight:600}

#aWatched .shut{opacity:0}
#aWatched.on .open,#aWatched.blink .open{opacity:0}
#aWatched.on .shut,#aWatched.blink .shut{opacity:1}
#aWatched .open,#aWatched .shut{position:absolute;transition:opacity .18s}
#aWatched.blink .shut{animation:lidshut .95s cubic-bezier(.4,0,.2,1)}
@keyframes lidshut{
  0%{transform:scaleY(1)}
  22%{transform:scaleY(.08)}
  45%{transform:scaleY(.08)}
  62%{transform:scaleY(.55)}
  100%{transform:scaleY(1)}
}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,12,15,.8);backdrop-filter:blur(24px) saturate(150%);
  border-top:.5px solid rgba(255,255,255,.07)}
.nv{flex:1;height:53px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;position:relative;color:#75736d;
  transition:color .18s}
.nv.on{color:#f2f1ee}
.nv svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nv span{font-size:9.5px;letter-spacing:.04em}
.nv .av{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10.5px;font-weight:700;color:#07140f}
.nv .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;
  border-radius:9px;background:#EF9F27;color:#412402;font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid #0c0c0f}
.nv .bdg.on{display:flex}

.ovl{position:absolute;top:calc(78px + env(safe-area-inset-top));padding:6px 13px;
  border-radius:9px;border:2.5px solid;font-size:14px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;opacity:0;pointer-events:none;z-index:5;white-space:nowrap}
.ovR{left:22px;transform:rotate(-10deg);border-color:#5dcaa5;color:#9fe1cb;
  background:rgba(29,158,117,.16)}
.ovL{right:22px;transform:rotate(10deg);border-color:#afa9ec;color:#cecbf6;
  background:rgba(127,119,221,.16)}

.seg{display:flex;gap:3px;background:#1a1a20;border-radius:11px;padding:3px;margin:6px 0 14px}
.sg{flex:1;text-align:center;font-size:12.5px;padding:8px 0;border-radius:9px;cursor:pointer;
  color:#9a988f;transition:background .15s}
.sg.on{background:#2f2f38;color:#f2f1ee;font-weight:600}

#coach{position:fixed;inset:0;z-index:28;background:rgba(8,8,10,.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:0 36px}
#coach.on{display:flex}
#coach h3{font-size:18px;font-weight:600}
.cg{display:flex;align-items:center;gap:13px;font-size:13.5px;color:#cfcdc5;width:100%;max-width:290px}
.cg .k{width:36px;height:36px;border-radius:10px;background:#1d1d24;display:flex;
  align-items:center;justify-content:center;flex:0 0 36px}
.cg .k svg{width:18px;height:18px;stroke:#9a988f;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

.flash{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:9;
  pointer-events:none;opacity:0;display:flex;justify-content:center;transition:opacity .18s}
.flash.on{opacity:1}
.flash span{font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;
  backdrop-filter:blur(14px)}
.flash.sh span{background:rgba(29,158,117,.9);color:#04342c}
.flash.so span{background:rgba(127,119,221,.9);color:#1b1733}
.flash.mu span{background:rgba(239,159,39,.94);color:#412402}

#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;z-index:12;
  background:#141418;border-radius:22px 22px 0 0;border-top:.5px solid rgba(255,255,255,.09);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#grab{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.17);margin:9px auto 0}
#shHead{padding:12px 20px 11px;display:flex;align-items:center;gap:10px;
  border-bottom:.5px solid rgba(255,255,255,.07)}
#shHead h2{font-size:16px;font-weight:600;flex:1}
#shClose{font-size:22px;color:#85837b;cursor:pointer;line-height:1;padding:0 4px}
#shBody{padding:8px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
/* The footer is a sibling of the scrolling body, not content inside it, so it
   cannot be pushed off screen by a long list however the list grows. */
#shFoot{flex:0 0 auto;display:none;gap:8px;align-items:center;
  padding:11px 20px calc(13px + env(safe-area-inset-bottom));
  border-top:.5px solid rgba(255,255,255,.1);background:#17171c}
#shFoot.on{display:flex}
#shFoot .f{margin-top:0;flex:1}
#shFoot .g{margin-left:0;flex:0 0 auto}
#sheet.foot #shBody{padding-bottom:10px}

/* Titles already at this rating, as posters rather than text rows: legible at
   arm's length, and scrolling sideways so it never competes with the sheet's
   own vertical scroll. */
.rstrip{display:flex;gap:9px;overflow-x:auto;margin-top:10px;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity}
.rstrip::-webkit-scrollbar{display:none}
.rcard{flex:0 0 80px;scroll-snap-align:start}
.rcard .rp{width:80px;height:116px;border-radius:7px;background:#1b1b21;
  background-size:cover;background-position:center}
.rcard .rt{font-size:10.5px;color:#9a988f;margin-top:5px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;opacity:0;
  pointer-events:none;transition:opacity .22s}
#veil.on{opacity:1;pointer-events:auto}

.crow{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.crow img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#22222a;flex:0 0 42px}
.crow .ph{width:42px;height:42px;border-radius:50%;background:#22222a;flex:0 0 42px}
.crow .nm{font-size:14.5px;font-weight:500}
.crow .ch{font-size:12.5px;color:#908e86;margin-top:1px}
.crow .rk{font-size:11px;color:#55544e;margin-left:auto;font-variant-numeric:tabular-nums}
/* Ratings, normalised. An 87%, a 7.4/10 and a 4.1/5 cannot be compared by eye
   in their native units, so every source is drawn on one 0-5 track with the
   native number kept beside it as the receipt. The amber line down the stack is
   your own rating: the distance between it and each bar is the whole point of
   the screen, and it is a glance rather than arithmetic. */
.rdial{display:flex;align-items:center;gap:18px;padding:4px 0 20px;
  border-bottom:.5px solid rgba(255,255,255,.07)}
.dwrap{position:relative;width:104px;height:104px;flex:0 0 104px}
.dwrap svg{width:104px;height:104px;transform:rotate(135deg)}
.dwrap circle{fill:none}
.dwrap .dt{stroke:rgba(255,255,255,.07);stroke-width:7}
.dwrap .dmt{stroke:rgba(255,255,255,.05);stroke-width:3}
.dwrap .da{stroke:#5dcaa5;stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.16,.84,.26,1)}
.dwrap .dm{stroke:#efa227;stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.16,.84,.26,1) .14s}
.dval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:1px;letter-spacing:-.03em}
.dval b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.dval i{font-size:12px;color:#6a6963;font-style:normal;align-self:flex-end;padding-bottom:7px}
.dmeta{flex:1;min-width:0}
.dlead{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6a6963;
  font-weight:600}
.dsub{font-size:12.5px;color:#a8a69d;margin-top:5px;line-height:1.45}
.dgap{display:inline-block;margin-top:9px;font-size:12px;font-weight:600;
  padding:4px 9px;border-radius:7px;background:rgba(239,162,39,.13);color:#efa227;
  opacity:0;transform:translateY(5px);
  transition:opacity .4s ease .7s,transform .4s cubic-bezier(.2,.8,.2,1) .7s}
.dgap.in{opacity:1;transform:none}
.dgap.cold{background:rgba(255,255,255,.055);color:#85837b;font-weight:500}

.rstack{padding:14px 0 2px}
.rbar{padding:9px 0}
.rbhd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.rbhd .nm{font-size:13px;color:#cfcdc5;font-weight:500;flex:0 0 auto}
.rbhd .ag{font-size:10px;color:#55544e;min-width:0;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.rbhd .nat{margin-left:auto;font-size:11.5px;color:#7e7c75;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.rbhd .n5{font-size:14.5px;font-weight:600;flex:0 0 auto;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
/* Ticks are painted into the track rather than drawn as elements, so every row
   carries the same 1-2-3-4-5 gridlines for free. */
.rtrack{position:relative;height:9px;border-radius:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.085) 0 1px,
    transparent 1px 20%),rgba(255,255,255,.045)}
.rtrack .fl{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;
  background:linear-gradient(90deg,#2d8a69,#5dcaa5);
  transition:width .85s cubic-bezier(.16,.84,.26,1)}
/* The marker sits at the same geometry in every row, so the eye joins them into
   one line down the stack without anything being drawn between the rows. */
.yl{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;
  background:#efa227;opacity:0;transition:opacity .35s ease .55s}
.rtrack.marked .yl{opacity:.92}
.raxis{display:flex;justify-content:space-between;margin-top:10px;
  font-size:9.5px;color:#43423e;font-variant-numeric:tabular-nums}
.rmine{display:flex;align-items:center;gap:8px;margin-top:15px;padding-top:13px;
  border-top:.5px solid rgba(255,255,255,.07);font-size:12px;color:#908e86;
  line-height:1.45}
.rmine .dot{width:8px;height:8px;border-radius:50%;background:#efa227;flex:0 0 8px}
.rnone{font-size:11.5px;color:#55544e;line-height:1.65;margin-top:14px}
.rnone b{color:#7e7c75;font-weight:500}

/* Pass-back. A one-sided proposal can be declined; a match cannot, so the
   control only appears on rows the other person put forward alone. */
.lrow .pbx{width:30px;height:30px;border-radius:50%;flex:0 0 30px;
  background:rgba(255,255,255,.055);border:.5px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,border-color .15s}
.lrow .pbx:active{background:rgba(240,149,149,.17);border-color:rgba(240,149,149,.42)}
.lrow .pbx svg{width:15px;height:15px;stroke:#908e86;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.lrow.pz{gap:9px;animation:pzin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pzin{from{background:rgba(240,149,149,.09)}to{background:transparent}}
.lrow.pz .lt{font-size:12.5px;color:#cfcdc5;line-height:1.35}
.lrow.pz .lt span{display:block;font-size:11px;color:#6a6963;margin-top:2px}
.pbtn{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;
  border:.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:#cfcdc5;flex:0 0 auto}
.pbtn.go{background:rgba(240,149,149,.15);border-color:rgba(240,149,149,.4);color:#f3a9a9}
.pnote{display:flex;align-items:center;gap:10px;font-size:12px;color:#9fe1cb;
  background:rgba(29,158,117,.11);border:.5px solid rgba(93,202,165,.24);
  border-radius:10px;padding:9px 11px;margin:2px 0 8px;
  animation:pnin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pnin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pnote b{margin-left:auto;color:#5dcaa5;cursor:pointer;font-weight:600;flex:0 0 auto}
.ptag{font-size:9.5px;color:#85837b;background:rgba(255,255,255,.06);
  padding:2px 6px;border-radius:5px;flex:0 0 auto;letter-spacing:.02em}

/* Honour the system setting: everything above still lands, it just lands at
   once instead of sweeping in. */
@media (prefers-reduced-motion:reduce){
  .rtrack .fl,.dwrap .da,.dwrap .dm,.dgap{transition-duration:1ms!important;
    transition-delay:0ms!important}
  .yl{transition-delay:0ms!important}
  .lrow.pz,.pnote{animation:none}
}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.lrow .th{width:38px;height:56px;border-radius:5px;background:#1b1b21;flex:0 0 38px;
  background-size:cover;background-position:center}
.lrow .lt{font-size:14px;flex:1;line-height:1.3;min-width:0}
.lrow .ly{font-size:12px;color:#6a6963;flex:0 0 auto}

/* Avatar stack. The gap between overlapping circles is not a margin: it is a
   ring painted in the sheet's own background colour, so each avatar punches a
   crescent out of the one beneath it. That is how Primer, Fluent and Nuxt all
   build this, and it is the only approach that stays legible once the circles
   are tinted rather than photographic. Overlap is 7 of 22px, about a third,
   which is the range those systems converge on. */
.wstack{display:flex;align-items:center;flex:0 0 auto}
.wa{position:relative;width:22px;height:22px;border-radius:50%;flex:0 0 22px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;letter-spacing:.01em;
  box-shadow:0 0 0 2px #141418}
.wa + .wa{margin-left:-7px}
/* A title can sit on the shared list and your private one at once. The dot
   marks the private half, and lives on the lower left, away from the overlap. */
.wa .pv{position:absolute;left:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;
  background:#7F77DD;box-shadow:0 0 0 1.6px #141418}

.stars{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.star{flex:0 0 calc(20% - 6px);padding:12px 0;border-radius:10px;background:#1b1b21;
  border:.5px solid rgba(255,255,255,.1);text-align:center;font-size:15px;font-weight:600;
  cursor:pointer;font-variant-numeric:tabular-nums}
.star.sel{background:#1d9e75;color:#04342c;border-color:#1d9e75}

.srow{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer;
  border-bottom:.5px solid rgba(255,255,255,.06)}

<script>

  if (!txt) return "";
  if (txt.length <= max) return txt;
  var cut = txt.slice(0, max);
  var dot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (dot > max * 0.45) return cut.slice(0, dot + 1);
  var sp = cut.lastIndexOf(" ");
  return (sp > 0 ? cut.slice(0, sp) : cut) + "…";

  if (!txt) return [];

function sbHeaders(extra) {

/* ---------------------------------------------- local model of the rows */

function blank() {
  return { shared: false, solo: false, watched: false, rating: null, note: null,
    passed: false };
}
function mineOf(key) { return state.mine[key] || (state.mine[key] = blank()); }

function applyRow(bucket, row) {
  var m = bucket[row.media_key] || (bucket[row.media_key] = blank());
  if (row.kind === "playlist_shared") m.shared = true;
  else if (row.kind === "playlist_solo") m.solo = true;
  else if (row.kind === "watched") m.watched = true;
  else if (row.kind === "rating") m.rating = Number(row.value);
  else if (row.kind === "note") m.note = row.value;
  else if (row.kind === "passed") m.passed = true;

  if (!state.me) return Promise.resolve();
  return sbGet("interaction?select=user_id,media_key,kind,value").then(function (rows) {
    state.mine = {}; state.theirs = {}; state.ratings = [];
    (rows || []).forEach(function (r) {
      if (r.user_id === state.me.id) {
        applyRow(state.mine, r);
        if (r.kind === "rating") state.ratings.push({ key: r.media_key, value: Number(r.value) });
      } else applyRow(state.theirs, r);

function loadTiers() {
  if (!state.me) return Promise.resolve();
  return sbGet("tier?user_id=eq." + state.me.id + "&select=idx,label,lower_bound,upper_bound&order=idx.desc")

    .catch(function () { state.tiers = []; });

var mediaCache = {};

  mediaCache[it.key] = { key: it.key, title: it.title, year: it.year, kind: it.kind,
    poster: it.poster, genres: it.genres || [] };
  return sbUpsert("media", [{
    key: it.key, source: it.source, kind: it.kind, title: it.title,
    year: it.year, poster: it.poster, genres: it.genres || []

  return rememberMedia(it).then(function () {
    return sbUpsert("interaction", [{
      user_id: state.me.id, media_key: it.key, kind: kind,
      value: value === undefined ? null : value, updated_at: new Date().toISOString()
    }], "user_id,media_key,kind");
  });
}

  return sbDelete("interaction",
    "user_id=eq." + state.me.id + "&media_key=eq." + encodeURIComponent(it.key) + "&kind=eq." + kind);

/* Writes against another person's rows. RLS is open, so this is possible at
   all; it is also the only way a pass can work, because the row that has to
   move belongs to them, not to you.

   There is no transaction over REST, so the order is load-bearing: the private
   row goes in before the shared row comes out. A failure between the two leaves
   the title on both lists, which is visible and fixable. The other order could
   drop it from both and lose their swipe outright. */
function writeFor(userId, key, kind, value) {
  return sbUpsert("interaction", [{
    user_id: userId, media_key: key, kind: kind,
    value: value === undefined ? null : value, updated_at: new Date().toISOString()
  }], "user_id,media_key,kind");
}
function dropFor(userId, key, kind) {
  return sbDelete("interaction",
    "user_id=eq." + userId + "&media_key=eq." + encodeURIComponent(key) + "&kind=eq." + kind);
}
function otherUser() {
  return state.users.filter(function (u) { return !state.me || u.id !== state.me.id; })[0] || null;

   private list of whoever put it forward, so their swipe survives -- it just
   stops being a joint proposal. Only the person who did not add it can pass it,
   which is why a matched title carries no pass control: once both have swiped
   it right there is nothing one-sided left to decline.

   lastPass carries the undo, including whether the title was already on their
   private list beforehand. Without that flag an undo would delete a private row
   they had put there themselves, long before any of this. */
var lastPass = null;

function passBack(key) {
  var other = otherUser();
  if (!state.me || !other) return Promise.reject(new Error("no second user"));
  var th = state.theirs[key] || (state.theirs[key] = blank());
  var hadSolo = !!th.solo;
  lastPass = { key: key, uid: other.id, hadSolo: hadSolo };

  th.shared = false; th.solo = true;
  mineOf(key).passed = true;

  return (hadSolo ? Promise.resolve() : writeFor(other.id, key, "playlist_solo"))
    .then(function () { return dropFor(other.id, key, "playlist_shared"); })
    .then(function () {
      // Audit only, and last on purpose: it needs the kind added by passed.sql.
      // Until that migration runs this one call 400s, and the move above still
      // stands -- so the failure is swallowed rather than surfaced.
      return writeFor(state.me.id, key, "passed").catch(function () {});
    });

function undoPass() {
  var p = lastPass;
  if (!p || !state.me) return Promise.resolve();
  lastPass = null;
  var th = state.theirs[p.key] || (state.theirs[p.key] = blank());
  th.shared = true; th.solo = p.hadSolo;
  mineOf(p.key).passed = false;

  return writeFor(p.uid, p.key, "playlist_shared")
    .then(function () {
      return p.hadSolo ? Promise.resolve() : dropFor(p.uid, p.key, "playlist_solo");
    })
    .then(function () { return dropFor(state.me.id, p.key, "passed").catch(function () {}); });

function loadMediaRows(keys) {
  var need = keys.filter(function (k) { return !mediaCache[k]; });
  if (!need.length) return Promise.resolve();
  var list = need.map(function (k) { return '"' + k + '"'; }).join(",");
  return sbGet("media?select=key,title,year,kind,poster,genres&key=in.(" + encodeURIComponent(list) + ")")
    .then(function (rows) { (rows || []).forEach(function (r) { mediaCache[r.key] = r; }); })
    .catch(function () {});

function bucket(capacity, refillMs) {

  if (!d || !more) return;
  more.onclick = function (ev) {
    ev.stopPropagation();
    if (node !== curNode()) return;
    state.expanded = !state.expanded;
    d.classList.toggle("open", state.expanded);
    more.textContent = state.expanded ? "… less" : "… more";
    if (!state.expanded) d.scrollTop = 0;
  };
}

function paintDetail(node, it, d) {
  if (!node || node._key !== it.key) return;
  if (d.tagline) { var t = node.querySelector(".tagLine"); if (t) t.textContent = d.tagline; }
  if (d.runtime && !it.runtime) {
    it.runtime = d.runtime;
    var mm = node.querySelector(".metaLine");
    if (mm) mm.insertAdjacentHTML("beforeend", "<span>" + d.runtime + " min</span>");
  }
  if (d.imdb) it.imdb = d.imdb;
  var sp = node.querySelector(".seasons"), lb = node.querySelector(".seasonsLbl");
  if (!sp) return;
  if (!d.seasons || !d.seasons.length) { sp.classList.remove("has"); if (lb) lb.classList.remove("has"); return; }
  sp.classList.add("has");
  if (lb) lb.classList.add("has");
  sp.innerHTML = d.seasons.map(function (sn, n) {
    return '<div class="season" data-s="' + n + '">' +
      '<div class="sp" style="' + (sn.poster ? "background-image:url('" + esc(sn.poster) + "')" : "") + '"></div>' +
      '<div class="sn">' + esc(sn.name) + "</div>" +
      '<div class="se">' + (sn.episodes ? sn.episodes + " ep" : "") +
        (sn.year ? (sn.episodes ? " · " : "") + sn.year : "") + "</div></div>";
  }).join("");
  Array.prototype.forEach.call(sp.querySelectorAll(".season"), function (el2) {
    el2.onclick = function (ev) {
      ev.stopPropagation();
      var sn = d.seasons[parseInt(el2.dataset.s, 10)];
      openSheet(sn.name,
        (sn.episodes ? '<p class="msg">' + sn.episodes + " episodes" + (sn.year ? ", from " + sn.year : "") + "</p>" : "") +
        '<p class="short" style="margin-top:12px">' + esc(sn.summary || "No season synopsis from this source.") + "</p>" +
        '<p class="credit">Per-episode rating and notes arrive in V1.</p>');
    };
  });
}

function preload(it) {
  if (!it || !it.poster) return;
  var im = new Image();
  im.src = it.poster;
  if (im.decode) im.decode().catch(function () {});
}

function fillNode(node, it) {
  if (!it) { node.style.visibility = "hidden"; node._key = null; return; }
  node.style.visibility = "";
  if (node._key === it.key) return;
  node._key = it.key;
  node.innerHTML = cardHTML(it);
  bindDesc(node);
  var have = state.detail[it.key];
  if (have) paintDetail(node, it, have);
  else detailFor(it).then(function (d) { paintDetail(node, it, d); });
}

function rotate(dir) {
  if (dir > 0) nodes.push(nodes.shift());
  else nodes.unshift(nodes.pop());
  for (var i = 0; i < 3; i++) nodes[i].className = "card s" + i;
}

function renderWindow() {
  var it = current();
  if (!it) return;
  var tr = el("track");
  if (!nodes.length) {
    for (var i = 0; i < 3; i++) {
      var n = document.createElement("div");
      n.className = "card s" + i;
      n._key = null;
      tr.appendChild(n);
      nodes.push(n);
    }
    bindGestures(tr);
  }
  tr.classList.remove("anim");
  void tr.offsetHeight;
  tr.style.transform = "translate3d(0,0,0)";
  nodes.forEach(function (n) { n.classList.remove("anim"); n.style.transform = "translate3d(0,0,0)"; });

  fillNode(nodes[0], state.queue[state.i - 1]);
  fillNode(nodes[1], it);
  fillNode(nodes[2], state.queue[state.i + 1]);

  state.expanded = false;
  nodes.forEach(function (n) {
    var d = n.querySelector(".desc"), m = n.querySelector(".more");
    if (d) { d.classList.remove("open"); d.scrollTop = 0; }
    if (m) m.textContent = "… more";
  });

  el("load").classList.add("off");
  paintRail();
  if (state.queue.length - state.i < 8) refill();
  preload(state.queue[state.i + 2]);
  preload(state.queue[state.i - 2]);
}

function paintRail() {
  var it = current(); if (!it) return;
  var mi = state.mine[it.key] || blank();
  var ew = el("aWatched");
  ew.className = "act" + (mi.watched ? " on" : "");
  el("aNote").className = "act" + (mi.note ? " on" : "");
  var rate = el("aRate");
  rate.className = "act" + (mi.rating != null ? " on" : "");
  rate.querySelector(".lbl").textContent = mi.rating != null ? mi.rating.toFixed(1) : "rate";
}

function commitAdvance(dir, skipTrack) {
  if (animating) return;
  animating = true;
  var gen = ++navGen;
  fillNode(nodes[dir > 0 ? 2 : 0], state.queue[state.i + dir]);
  var ms = 0;
  if (!skipTrack) {
    var tr = el("track");
    tr.classList.add("anim");
    tr.style.transform = "translate3d(0," + (dir > 0 ? "-100%" : "100%") + ",0)";
    ms = 320;
  }
  setTimeout(function () {
    if (gen !== navGen) return;
    state.i += dir;
    rotate(dir);
    animating = false;
    renderWindow();
    cacheFeed();
  }, ms);
}

function advance(dir, skipTrack) {
  if (animating) return;
  var ni = state.i + dir;
  if (ni < 0) { bounce(1); return; }
  if (ni >= state.queue.length) {
    refill().then(function () {
      if (state.queue[ni]) commitAdvance(dir, skipTrack); else bounce(-1);
    });
    return;
  }
  commitAdvance(dir, skipTrack);
}

function bounce(sign) {
  var tr = el("track");
  tr.classList.add("anim");
  tr.style.transform = "translate3d(0," + (sign > 0 ? 16 : -16) + "px,0)";
  setTimeout(function () { tr.style.transform = "translate3d(0,0,0)"; }, 180);
}

function flash(kind, text) {
  var f = el("flash");
  f.querySelector("span").textContent = text;
  f.className = "flash on " + kind;
  setTimeout(function () { f.className = "flash " + kind; }, 1100);
}

function refreshChrome(it) {
  counts();
  var cu = current();
  if (!cu || cu.key !== it.key) return;
  paintRail();
  var ch = q(".chips");
  if (ch) ch.innerHTML = chipsFor(it);
}

function collect(which) {
  var it = current();
  if (!it || !state.me || animating) return;
  var kind = which === "sh" ? "playlist_shared" : "playlist_solo";
  var mi = mineOf(it.key);
  if (which === "sh") mi.shared = true; else mi.solo = true;
  counts();
  var th = state.theirs[it.key] || blank();
  var matched = which === "sh" && th.shared;
  flash(matched ? "mu" : which,
    matched ? "Match — " + otherName() + " wants this too"
            : (which === "sh" ? "Added to shared" : "Added to yours"));
  writeInteraction(it, kind).catch(function (e) { flash("so", "Not saved: " + e.message); });
  var n = curNode();
  if (n) {
    n.classList.add("anim");
    n.style.transform = "translate3d(" + (which === "sh" ? "112%" : "-112%") + ",0,0) rotate(" +
      (which === "sh" ? 8 : -8) + "deg)";
  }
  setTimeout(function () { advance(1, true); }, 230);
}

function counts() {
  var mu = mutualKeys().length, b = el("bdgMu");
  b.textContent = mu;
  b.className = "bdg" + (mu ? " on" : "");
}

/* -------------------------------------------------------------- gestures */

function bindGestures(tr) {
  var sx = 0, sy = 0, dx = 0, dy = 0, drag = false, axis = null, raf = 0;
  var wantT = null, wantC = null, lastY = 0, lastT = 0, vel = 0;

  function paint() {
    raf = 0;
    if (wantT !== null) tr.style.transform = wantT;
    if (wantC !== null && nodes[1]) nodes[1].style.transform = wantC;
  }
  function push() { if (!raf) raf = requestAnimationFrame(paint); }

  function overlays(x) {
    var n = nodes[1]; if (!n) return;
    var r = n.querySelector(".ovR"), l = n.querySelector(".ovL");
    if (!r || !l) return;
    var o = Math.min(1, Math.abs(x) / 90);
    r.style.opacity = x > 0 ? o : 0;
    l.style.opacity = x < 0 ? o : 0;
  }

  function insideScrollable(target) {
    var n = target;
    while (n && n !== tr) {
      if (n.classList) {
        if (n.classList.contains("desc") && state.expanded) return true;
        if (n.classList.contains("seasons")) return true;
      }
      n = n.parentNode;
    }
    return false;
  }

  tr.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1 || animating) { drag = false; return; }
    if (insideScrollable(e.target)) { drag = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    dx = dy = 0; drag = true; axis = null;
    wantT = wantC = null; vel = 0;
    lastY = sy; lastT = Date.now();
    tr.classList.remove("anim");
    if (nodes[1]) nodes[1].classList.remove("anim");
  }, { passive: true });

  tr.addEventListener("touchmove", function (e) {
    if (!drag) return;
    var y = e.touches[0].clientY;
    dx = e.touches[0].clientX - sx;
    dy = y - sy;
    var now = Date.now();
    if (now > lastT) { vel = (y - lastY) / (now - lastT); lastY = y; lastT = now; }
    if (!axis) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      else return;
    }
    if (axis === "y" && state.expanded) return;
    e.preventDefault();
    if (axis === "x") {
      overlays(dx);
      wantC = "translate3d(" + dx + "px,0,0) rotate(" + (dx / 38) + "deg)";
    } else {
      var open = dy < 0 ? state.queue[state.i + 1] : state.queue[state.i - 1];
      var shown = open ? dy : dy * 0.28;
      wantT = "translate3d(0," + shown + "px,0)";
    }
    push();
  }, { passive: false });

  tr.addEventListener("touchend", function () {
    if (!drag) return;
    drag = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    var THx = 70;
    var THy = Math.max(72, window.innerHeight * 0.15);
    if (axis === "x" && Math.abs(dx) > THx) { collect(dx > 0 ? "sh" : "so"); return; }
    if (axis === "y" && !state.expanded &&
        (Math.abs(dy) > THy || (Math.abs(vel) > 0.55 && Math.abs(dy) > 24))) {
      advance(dy < 0 ? 1 : -1);
      return;
    }
    overlays(0);
    tr.classList.add("anim");
    tr.style.transform = "translate3d(0,0,0)";
    if (nodes[1]) {
      nodes[1].classList.add("anim");
      nodes[1].style.transform = "translate3d(0,0,0)";
    }
  }, { passive: true });
}

document.addEventListener("keydown", function (e) {
  if (el("sheet").classList.contains("on")) { if (e.key === "Escape") closeSheet(); return; }
  if (el("prof").classList.contains("on")) { if (e.key === "Escape") el("prof").classList.remove("on"); return; }
  if (el("gate").classList.contains("on")) return;
  if (e.key === "ArrowUp") advance(-1);
  else if (e.key === "ArrowDown") advance(1);
  else if (e.key === "ArrowRight") collect("sh");
  else if (e.key === "ArrowLeft") collect("so");
});

/* ---------------------------------------------------------------- sheets */

function openSheet(title, html, footHTML) {
  el("shHead").querySelector("h2").textContent = title;
  el("shBody").innerHTML = html;
  el("shBody").scrollTop = 0;
  var f = el("shFoot");
  f.innerHTML = footHTML || "";
  f.className = footHTML ? "on" : "";
  el("sheet").classList.toggle("foot", !!footHTML);
  el("sheet").classList.add("on");
  el("veil").classList.add("on");
}
function closeSheet() {
  passing = null; passedNote = null;
  el("sheet").classList.remove("on");
  el("veil").classList.remove("on");
  if (!el("prof").classList.contains("on") && typeof setNav === "function") setNav("nvFeed");
}
el("shClose").onclick = closeSheet;
el("veil").onclick = closeSheet;

el("cLeft").onclick = function () {
  var it = current(); if (!it) return;
  openSheet("Cast", '<p class="msg">Loading…</p>');
  detailFor(it).then(function (d) {
    if (!d.cast.length) { openSheet("Cast", '<p class="msg">No cast listed at the source.</p>'); return; }
    var rows = d.cast.map(function (c) {
      return '<div class="crow">' +
        (c.img ? '<img src="' + esc(c.img) + '" alt="">' : '<div class="ph"></div>') +
        "<div><div class='nm'>" + esc(c.name) + "</div>" +
        (c.character ? "<div class='ch'>as " + esc(c.character) + "</div>" : "") + "</div>" +
        "<div class='rk'>" + c.rank + "</div></div>";
    }).join("");
    var how = d.ranked === "popularity" ? "Ranked by TMDB person popularity, not billing order."
      : d.ranked === "favourites" ? "Characters in MyAnimeList favourite order, with the Japanese voice actor."
      : "Ordered by billing, which is all this source exposes.";
    openSheet("Cast", rows + '<p class="credit">' + how + "</p>");
  });
};

/* The ratings sheet. Three layers, in the order the eye wants them: one number
   for "what does the world think", one line for "and what did I think", then
   the per-source breakdown for anyone who wants to argue with the average.

   Entry is animated because the comparison is spatial -- bars growing to
   different lengths under a fixed marker says "these disagree, and by this
   much" in a way five static numbers in a column never did. */
var ratingsRAF = 0;
var OUT_ARC = 216.77, IN_ARC = 164.93;   // 270 degrees of r=46 and r=35

function gapChip(con, mine) {
  if (mine == null) {
    return '<div class="dgap cold" id="dGap">rate it to see where you land</div>';
  }
  if (!con) return '<div class="dgap" id="dGap">you rated ' + mine.toFixed(1) + "</div>";
  var d = mine - con.avg;
  return '<div class="dgap" id="dGap">' + (Math.abs(d) < 0.05
    ? "you rated " + mine.toFixed(1) + " — dead on the average"
    : "you rated " + mine.toFixed(1) + " · " + Math.abs(d).toFixed(1) +
      (d > 0 ? " above" : " below")) + "</div>";
}

function paintRatings(it, ext, loading) {
  ext = ext || {};
  var mi = state.mine[it.key] || blank();
  var mine = mi.rating;
  var vals = extAll(it, ext);
  var con = consensus(vals);
  var mf = mine != null ? mine / 5 : 0;

  var dial = '<div class="rdial"><div class="dwrap">' +
    '<svg viewBox="0 0 104 104" aria-hidden="true">' +
      '<circle class="dt" cx="52" cy="52" r="46" stroke-dasharray="216.77 72.26"></circle>' +
      (mine != null ? '<circle class="dmt" cx="52" cy="52" r="35" ' +
        'stroke-dasharray="164.93 54.98"></circle>' : "") +
      '<circle class="da" id="dArc" cx="52" cy="52" r="46" ' +
        'stroke-dasharray="216.77 72.26" stroke-dashoffset="' + OUT_ARC + '"></circle>' +
      (mine != null ? '<circle class="dm" id="dMine" cx="52" cy="52" r="35" ' +
        'stroke-dasharray="164.93 54.98" stroke-dashoffset="' + IN_ARC + '"></circle>' : "") +
    "</svg>" +
    '<div class="dval"><b id="dNum">' + (con ? "0.0" : "—") + "</b><i>/5</i></div>" +
    "</div><div class=\"dmeta\">" +
      '<div class="dlead">' + (con ? "World average" : loading ? "Checking" : "No scores") + "</div>" +
      '<div class="dsub">' + (con
        ? "mean of " + con.n + " source" + (con.n === 1 ? "" : "s") +
          ", each converted to a five-point scale"
        : loading ? "asking every source we have" : "nothing published for this title yet") +
      "</div>" + gapChip(con, mine) +
    "</div></div>";

  var present = EXT_ORDER.filter(function (sc) { return vals[sc]; });
  var bars = present.map(function (sc, n) {
    var m = EXT_META[sc], r = vals[sc], v5 = to5(sc, r.value);
    var bits = [];
    if (r.votes) bits.push(r.votes.toLocaleString() + " votes");
    if (m.tag) bits.push(m.tag);
    if (r.manual) bits.push("entered by hand");
    else if (r.live) bits.push("live from this source");
    else if (r.at) bits.push("fetched " + agoText(r.at));
    return '<div class="rbar">' +
      '<div class="rbhd"><span class="nm">' + m.label + "</span>" +
        '<span class="ag">' + esc(bits.join(" · ")) + "</span>" +
        '<span class="nat">' + nativeText(sc, r.value) + "</span>" +
        '<span class="n5">' + v5.toFixed(1) + "</span></div>" +
      '<div class="rtrack' + (mine != null ? " marked" : "") + '">' +
        '<i class="fl" data-w="' + (v5 / 5 * 100).toFixed(2) +
          '" style="transition-delay:' + (n * 70) + 'ms"></i>' +
        (mine != null ? '<b class="yl" style="left:' + (mf * 100).toFixed(2) + '%"></b>' : "") +
      "</div></div>";
  }).join("");

  var stack = present.length
    ? '<div class="rstack">' + bars +
      '<div class="raxis"><span>0</span><span>1</span><span>2</span><span>3</span>' +
      "<span>4</span><span>5</span></div></div>"
    : "";

  var legend = "";
  if (present.length && mine != null) {
    legend = '<div class="rmine"><i class="dot"></i><span>The amber line is your ' +
      mine.toFixed(1) + ". Bars that stop short of it scored lower than you did; " +
      "bars that run past it scored higher.</span></div>";
  } else if (present.length) {
    legend = '<div class="rmine"><span>Rate this and the line appears across every ' +
      "bar, so your score reads against the rest in place.</span></div>";
  }

  var gone = EXT_ORDER.filter(function (sc) { return !vals[sc] && expected(sc, it); });
  var absent = gone.length
    ? '<p class="rnone">No score: ' + gone.map(function (sc) {
        return "<b>" + EXT_META[sc].label + "</b> — " + esc(whyAbsent(sc, it, loading));
      }).join("; ") + ".</p>"
    : "";

  openSheet("Ratings", dial + stack + legend + absent +
    (ext._writeError
      ? '<p class="credit bad">Shown but not saved — writing to media_rating failed: ' +
        esc(ext._writeError) + ". These scores will be refetched every time until that is fixed.</p>"
      : "") +
    '<p class="credit">Each source is converted to a five-point scale so your own ' +
    "rating is comparable at a glance, with the native number kept beside it. The " +
    "average is unweighted: IMDb's millions and Metacritic's dozen critics count " +
    "equally, because a weighting you cannot reconstruct from this screen is worse " +
    "than a mean you can. Every score carries when it was fetched, so a stale " +
    "number looks stale rather than passing for current. Absent is a real state, " +
    "not an error.</p>");

  animateRatings(con, mine);
}

/* Widths and dash offsets are written one frame after the markup lands. Setting
   them in the same frame as the element is created gives no transition at all --
   the browser has no previous value to interpolate from, so it paints the final
   state and the motion is simply lost. */
function animateRatings(con, mine) {
  var rq = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
  var rc = window.cancelAnimationFrame || clearTimeout;
  rc(ratingsRAF);
  ratingsRAF = rq(function () {
    var body = el("shBody");
    if (!body) return;
    Array.prototype.forEach.call(body.querySelectorAll(".rtrack .fl"), function (n) {
      n.style.width = n.getAttribute("data-w") + "%";
    });
    var arc = body.querySelector("#dArc");
    if (arc && con) arc.style.strokeDashoffset = (OUT_ARC * (1 - con.avg / 5)).toFixed(2);
    var dm = body.querySelector("#dMine");
    if (dm && mine != null) dm.style.strokeDashoffset = (IN_ARC * (1 - mine / 5)).toFixed(2);
    var gap = body.querySelector("#dGap");
    if (gap) gap.className = gap.className + " in";
    if (con) countUp(body.querySelector("#dNum"), con.avg, 820);
  });
}

/* Counts the headline number up rather than printing it. Cubic ease-out, so it
   decelerates into the value instead of stopping dead on it. */
function countUp(node, to, ms) {
  if (!node) return;
  var rq = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
  var t0 = 0;
  function step(ts) {
    if (!t0) t0 = ts || Date.now();
    var p = Math.min(1, ((ts || Date.now()) - t0) / ms);
    node.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(1);
    if (p < 1) rq(step);
  }
  rq(step);
}

el("cRight").onclick = function () {
  var it = current(); if (!it) return;
  var known = state.ext[it.key];
  paintRatings(it, known, !known);
  extRatings(it).then(function (ext) {
    if (current() === it && el("sheet").classList.contains("on")) paintRatings(it, ext, false);
  }).catch(function () {
    if (current() === it && el("sheet").classList.contains("on")) paintRatings(it, known, false);
  });
};

/* ------------------------------------------------------------ the actions */

el("aWatched").onclick = function () {
  var it = current(); if (!it || !state.me) return;
  var mi = mineOf(it.key), node = el("aWatched");
  if (mi.watched) {
    mi.watched = false;
    node.className = "act";
    dropInteraction(it, "watched").catch(function () {});
  } else {
    mi.watched = true;
    node.classList.remove("blink");
    void node.offsetWidth;
    node.classList.add("blink");
    setTimeout(function () { node.classList.remove("blink"); node.classList.add("on"); }, 950);
    writeInteraction(it, "watched").catch(function (e) { flash("so", "Not saved: " + e.message); });
  }
  counts();
  var ch = q(".chips");
  if (ch) ch.innerHTML = chipsFor(it);
};

var RATINGS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];

function rateSheet(it, picked) {
  var mi = state.mine[it.key] || blank();
  var sel = picked === undefined ? mi.rating : picked;
  var same = sel == null ? [] : state.ratings.filter(function (r) {
    return r.value === sel && r.key !== it.key;
  });

  function build() {
    var stars = RATINGS.map(function (v) {
      return '<div class="star' + (v === sel ? " sel" : "") + '" data-v="' + v + '">' + v.toFixed(1) + "</div>";
    }).join("");
    var panel = "";
    if (sel != null) {
      panel = same.length
        ? '<p class="msg" style="margin-top:16px">You have rated ' + same.length + " other " +
          (same.length === 1 ? "title" : "titles") + " exactly " + sel.toFixed(1) + ":</p>" +
          '<div class="rstrip">' + same.slice(0, 40).map(function (r) {
            var rec = mediaCache[r.key] || {};
            return '<div class="rcard"><div class="rp" style="' +
              (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '"></div>' +
              '<div class="rt">' + esc(rec.title || r.key) + "</div></div>";
          }).join("") + "</div>"
        : '<p class="msg" style="margin-top:16px">Nothing else sits at ' + sel.toFixed(1) +
          " yet. This title defines the shelf.</p>";
    }
    openSheet("Rate — " + it.title,
      '<div class="stars">' + stars + "</div>" + panel,
      '<button class="f" id="rSave"' + (sel == null ? " disabled" : "") + ">Save" +
        (sel != null ? " " + sel.toFixed(1) : "") + "</button>" +
      (mi.rating != null ? '<button class="f g" id="rClear">Clear</button>' : ""));

    Array.prototype.forEach.call(el("shBody").querySelectorAll(".star"), function (node) {
      node.onclick = function () {
        var v = parseFloat(node.dataset.v);
        rateSheet(it, v === sel ? null : v);
      };
    });
    el("rSave").onclick = function () {
      if (sel == null) return;
      var rec0 = mineOf(it.key);
      rec0.rating = sel;
      var needWatched = !rec0.watched;
      rec0.watched = true;
      var exist = state.ratings.filter(function (r) { return r.key === it.key; })[0];
      if (exist) exist.value = sel; else state.ratings.push({ key: it.key, value: sel });
      mediaCache[it.key] = { key: it.key, title: it.title, year: it.year, kind: it.kind,
        poster: it.poster, genres: it.genres || [] };
      closeSheet(); refreshChrome(it);
      writeInteraction(it, "rating", sel).catch(function (e) { flash("so", "Not saved: " + e.message); });
      if (needWatched) writeInteraction(it, "watched").catch(function () {});
    };
    if (el("rClear")) el("rClear").onclick = function () {
      mineOf(it.key).rating = null;
      state.ratings = state.ratings.filter(function (r) { return r.key !== it.key; });
      closeSheet(); refreshChrome(it);
      dropInteraction(it, "rating").catch(function () {});
    };
  }
  loadMediaRows(same.map(function (r) { return r.key; })).then(build);
}

el("aRate").onclick = function () { var it = current(); if (it && state.me) rateSheet(it, undefined); };

el("aNote").onclick = function () {
