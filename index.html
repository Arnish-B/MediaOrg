<script>

function el(id) { return document.getElementById(id); }

function clip(txt, max) {
  if (!txt) return "";
  if (txt.length <= max) return txt;
  var cut = txt.slice(0, max);
  var dot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (dot > max * 0.45) return cut.slice(0, dot + 1);
  var sp = cut.lastIndexOf(" ");
  return (sp > 0 ? cut.slice(0, sp) : cut) + "…";

  if (!txt) return [];
  var sents = txt.match(/[^.!?]+[.!?]+(\s|$)/g);
  if (!sents || sents.length < 4) return [txt];
  var mid = Math.ceil(sents.length / 2);
  return [sents.slice(0, mid).join("").trim(), sents.slice(mid).join("").trim()];

  var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;

/* ------------------------------------------------------------- supabase */

function sbHeaders(extra) {
  var h = {
    apikey: SUPA_KEY,
    Authorization: "Bearer " + SUPA_KEY,

}

function sbGet(path) {
  return getJSON(SUPA_URL + "/rest/v1/" + path, 12000, { headers: sbHeaders() });
}

function sbUpsert(table, rows, conflict) {
  return getJSON(
    SUPA_URL + "/rest/v1/" + table + (conflict ? "?on_conflict=" + conflict : ""),
    12000,
    {
      method: "POST",
      headers: sbHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify(rows)

}

function sbDelete(table, query) {
  return getJSON(SUPA_URL + "/rest/v1/" + table + "?" + query, 12000, {
    method: "DELETE", headers: sbHeaders({ Prefer: "return=minimal" })
  });
}

/* ---------------------------------------------- local model of the rows */

function blank() { return { shared: false, solo: false, watched: false, rating: null, note: null }; }
function mineOf(key) { return state.mine[key] || (state.mine[key] = blank()); }

function applyRow(bucket, row) {
  var m = bucket[row.media_key] || (bucket[row.media_key] = blank());
  if (row.kind === "playlist_shared") m.shared = true;
  else if (row.kind === "playlist_solo") m.solo = true;
  else if (row.kind === "watched") m.watched = true;
  else if (row.kind === "rating") m.rating = Number(row.value);
  else if (row.kind === "note") m.note = row.value;
}

function loadMine() {
  if (!state.me) return Promise.resolve();
  return sbGet("interaction?select=user_id,media_key,kind,value").then(function (rows) {
    state.mine = {}; state.theirs = {}; state.ratings = [];
    (rows || []).forEach(function (r) {
      if (r.user_id === state.me.id) {
        applyRow(state.mine, r);
        if (r.kind === "rating") state.ratings.push({ key: r.media_key, value: Number(r.value) });
      } else {
        applyRow(state.theirs, r);
      }
    });
  }).catch(function (e) { state.diag.db = e.message; });
}

function mutualKeys() {
  var out = [];
  for (var k in state.mine) {
    if (state.mine[k].shared && state.theirs[k] && state.theirs[k].shared) out.push(k);
  }
  return out;
}

var mediaCache = {};
function rememberMedia(it) {
  mediaCache[it.key] = { title: it.title, year: it.year, kind: it.kind, poster: it.poster };
  return sbUpsert("media", [{
    key: it.key, source: it.source, kind: it.kind, title: it.title,
    year: it.year, poster: it.poster, genres: it.genres || []
  }], "key");
}

function writeInteraction(it, kind, value) {
  return rememberMedia(it).then(function () {
    return sbUpsert("interaction", [{
      user_id: state.me.id, media_key: it.key, kind: kind,
      value: value === undefined ? null : value,

function dropInteraction(it, kind) {
  return sbDelete("interaction",
    "user_id=eq." + state.me.id + "&media_key=eq." + encodeURIComponent(it.key) + "&kind=eq." + kind);

  var need = keys.filter(function (k) { return !mediaCache[k]; });
  if (!need.length) return Promise.resolve();
  var list = need.map(function (k) { return '"' + k + '"'; }).join(",");
  return sbGet("media?select=key,title,year,kind,poster&key=in.(" + encodeURIComponent(list) + ")")
    .then(function (rows) {
      (rows || []).forEach(function (r) { mediaCache[r.key] = r; });

function gate(ms) {
  var last = 0;
  return function () {
    var wait = Math.max(0, ms - (Date.now() - last));
    last = Date.now() + wait;
    return new Promise(function (r) { setTimeout(r, wait); });

var gTmdb = gate(260);

  var q = new URLSearchParams(params || {}).toString();
  return gTmdb().then(function () { return getJSON(worker + "/tmdb/" + path + (q ? "?" + q : "")); });

function genreNames(ids, kind) {
  var map = state.genres[kind] || {};

  var full = (m.overview || "").trim();

    key: "tmdb:movie:" + m.id, source: "tmdb", sourceKind: "movie", sourceId: m.id,

    year: t.first_air_date ? parseInt(t.first_air_date.slice(0, 4), 10) : null,
    poster: t.poster_path ? IMG + t.poster_path : null,
    genres: genreNames(t.genre_ids, "tv"), runtime: null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: null,
    ratings: { tmdb: t.vote_average ? Math.round(t.vote_average * 10) / 10 : null,
               tmdbVotes: t.vote_count || null },
    extra: null
  };
}
function fromTvmaze(s) {
  var full = strip(s.summary);
  return {
    key: "tvmaze:" + s.id, source: "tvmaze", sourceId: s.id, kind: "show",
    title: s.name, tagline: null,
    year: s.premiered ? parseInt(s.premiered.slice(0, 4), 10) : null,
    poster: s.image ? (s.image.original || s.image.medium) : null,
    genres: s.genres || [], runtime: s.averageRuntime || s.runtime || null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: s.externals ? s.externals.imdb : null,
    ratings: { tvmaze: s.rating && s.rating.average ? s.rating.average : null },
    extra: s.network ? s.network.name : (s.webChannel ? s.webChannel.name : null)
  };
}
function fromJikan(a) {
  var full = (a.synopsis || "").replace(/\s*\[Written by MAL Rewrite\]\s*/i, "").trim();
  return {
    key: "mal:" + a.mal_id, source: "mal", sourceId: a.mal_id,
    kind: a.type === "Movie" ? "anime film" : "anime",
    title: a.title_english || a.title, tagline: null,
    year: a.year || (a.aired && a.aired.from ? parseInt(a.aired.from.slice(0, 4), 10) : null),
    poster: a.images && a.images.jpg ? (a.images.jpg.large_image_url || a.images.jpg.image_url) : null,
    genres: (a.genres || []).map(function (g) { return g.name; }), runtime: null,
    descShort: clip(full, 230), descLong: full, thin: full.length <= 260,
    imdb: null,
    ratings: { mal: a.score || null, malVotes: a.scored_by || null },
    extra: a.episodes ? a.episodes + " episodes" : null
  };
}

/* ---------------------------------------------------------------- pools */

function loadGenres() {
  if (!worker || state.genres.movie) return Promise.resolve();
  return Promise.all([tmdb("genre/movie/list"), tmdb("genre/tv/list")]).then(function (r) {
    state.genres.movie = {}; state.genres.tv = {};
    (r[0].genres || []).forEach(function (g) { state.genres.movie[g.id] = g.name; });
    (r[1].genres || []).forEach(function (g) { state.genres.tv[g.id] = g.name; });
  }).catch(function (e) { state.diag.genres = e.message; });
}
function loadTmdbMovies() {
  return tmdb("discover/movie", { sort_by: "popularity.desc", page: 1 + rnd(45),
    "vote_count.gte": 400, include_adult: false, language: "en-US" })
    .then(function (d) {
      return (d.results || []).filter(function (m) { return m.poster_path && m.overview; }).map(fromTmdbMovie);
    }).catch(function (e) { state.diag.movies = e.message; return []; });
}
function loadTmdbShows() {
  return tmdb("discover/tv", { sort_by: "popularity.desc", page: 1 + rnd(30),
    "vote_count.gte": 150, include_adult: false, language: "en-US" })
    .then(function (d) {
      return (d.results || []).filter(function (t) { return t.poster_path && t.overview; }).map(fromTmdbTv);
    }).catch(function (e) { state.diag.shows = e.message; return []; });
}
function loadTvmaze() {
  return getJSON("https://api.tvmaze.com/shows?page=" + rnd(180)).then(function (arr) {
    return arr.filter(function (s) {
      return s.image && s.summary && s.rating && s.rating.average >= 6.8;
    }).map(fromTvmaze);
  }).catch(function (e) { state.diag.tvmaze = e.message; return []; });
}
function loadAnime() {
  return gJikan()
    .then(function () { return getJSON("https://api.jikan.moe/v4/top/anime?page=" + (1 + rnd(14)) + "&limit=25"); })
    .then(function (j) {
      return (j.data || []).filter(function (a) { return a.synopsis && a.images; }).map(fromJikan);
    }).catch(function (e) { state.diag.anime = e.message; return []; });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function refill() {
  if (state.busy) return Promise.resolve();
  state.busy = true;
  return loadGenres().then(function () {
    return Promise.all(worker ? [loadTmdbMovies(), loadTmdbShows(), loadAnime()]
                              : [loadTvmaze(), loadAnime()]);
  }).then(function (res) {
    var mixed = worker
      ? shuffle(res[0]).slice(0, 14).concat(shuffle(res[1]).slice(0, 10)).concat(shuffle(res[2]).slice(0, 8))
      : shuffle(res[0]).slice(0, 26).concat(shuffle(res[1]).slice(0, 9));
    var seen = {};
    state.queue.forEach(function (q) { seen[q.key] = 1; });
    state.queue = state.queue.concat(shuffle(mixed.filter(function (m) { return !seen[m.key]; })));
    state.busy = false;
  }).catch(function () { state.busy = false; });
}

/* --------------------------------------------------- detail: cast, seasons */

function detailFor(item) {
  if (state.detail[item.key]) return Promise.resolve(state.detail[item.key]);
  var p;
  if (item.source === "tmdb") {
    p = tmdb(item.sourceKind + "/" + item.sourceId, { append_to_response: "credits,external_ids" })
      .then(function (d) {
        var cast = ((d.credits && d.credits.cast) || []).slice(0, 40).map(function (c) {
          return { name: c.name, character: c.character || "",
            img: c.profile_path ? IMG_S + c.profile_path : null,
            pop: c.popularity || 0, billing: (c.order == null ? 999 : c.order) + 1 };
        });
        cast.sort(function (a, b) { return b.pop - a.pop; });
        cast = cast.slice(0, 24).map(function (c, n) { c.rank = n + 1; return c; });
        var seasons = (d.seasons || []).filter(function (s) { return s.season_number > 0; })
          .map(function (s) {
            return { number: s.season_number, name: s.name || ("Season " + s.season_number),
              poster: s.poster_path ? IMG_S + s.poster_path : null,
              episodes: s.episode_count, summary: (s.overview || "").trim(),
              year: s.air_date ? s.air_date.slice(0, 4) : null };
          });
        return { cast: cast, seasons: seasons,
          imdb: d.external_ids ? d.external_ids.imdb_id : null,
          tagline: d.tagline || null,
          runtime: d.runtime || (d.episode_run_time && d.episode_run_time[0]) || null,
          ranked: "popularity" };
      });
  } else if (item.source === "tvmaze") {
    p = getJSON("https://api.tvmaze.com/shows/" + item.sourceId + "?embed[]=cast&embed[]=seasons")
      .then(function (d) {
        var em = d._embedded || {};
        return {
          cast: (em.cast || []).slice(0, 24).map(function (c, n) {
            return { name: c.person ? c.person.name : "",
              character: c.character ? c.character.name : "",
              img: c.person && c.person.image ? c.person.image.medium : null,
              rank: n + 1, billing: n + 1 };
          }),
          seasons: (em.seasons || []).filter(function (s) { return s.number; }).map(function (s) {
            return { number: s.number, name: s.name || ("Season " + s.number),
              poster: s.image ? (s.image.medium || s.image.original) : null,
              episodes: s.episodeOrder, summary: strip(s.summary),
              year: s.premiereDate ? s.premiereDate.slice(0, 4) : null };
          }),
          ranked: "billing"
        };
      });
  } else {
    p = gJikan()
      .then(function () { return getJSON("https://api.jikan.moe/v4/anime/" + item.sourceId + "/characters"); })
      .then(function (j) {
        return {
          cast: (j.data || []).slice(0, 24).map(function (c, n) {
            var va = (c.voice_actors || []).filter(function (v) { return v.language === "Japanese"; })[0]
                   || (c.voice_actors || [])[0];
            return { name: va && va.person ? va.person.name : "(voice unknown)",
              character: c.character ? c.character.name : "",
              img: c.character && c.character.images ? c.character.images.jpg.image_url : null,
              rank: n + 1, billing: n + 1 };
          }),
          seasons: [], ranked: "favourites"
        };
      });
  }
  return p.then(function (d) { state.detail[item.key] = d; return d; })
    .catch(function () { var d = { cast: [], seasons: [], failed: true }; state.detail[item.key] = d; return d; });
}

/* ---------------------------------------------------------------- render */

function cardHTML(it) {
  var bits = [];
  if (it.year) bits.push("<span>" + it.year + "</span>");
  if (it.genres.length) bits.push("<span>" + esc(it.genres.slice(0, 3).join(", ")) + "</span>");
  if (it.runtime) bits.push("<span>" + it.runtime + " min</span>");
  if (it.extra) bits.push("<span>" + esc(it.extra) + "</span>");

  var longHTML = paras(it.descLong).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  var note = it.thin
    ? '<p class="samenote">This source publishes a single synopsis, so the long description is the same text set out in full.</p>'
    : "";

  var mk = [], mi = state.mine[it.key] || blank(), th = state.theirs[it.key] || blank();
  if (mi.shared && th.shared) mk.push('<span class="chip" style="background:rgba(239,159,39,.2);color:#fac775;font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px">Both want this</span>');
  else if (mi.shared) mk.push('<span class="chip" style="background:rgba(29,158,117,.2);color:#9fe1cb;font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px">Shared</span>');
  else if (th.shared) mk.push('<span class="chip" style="background:rgba(29,158,117,.14);color:#6fae95;font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px">' + esc(otherName()) + ' wants this</span>');
  if (mi.solo) mk.push('<span class="chip" style="background:rgba(127,119,221,.2);color:#cecbf6;font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px">Only me</span>');
  if (mi.note) mk.push('<span class="chip" style="background:rgba(255,255,255,.07);color:#9a988f;font-size:10.5px;padding:2px 8px;border-radius:5px">note</span>');

  return '<div class="poster" style="' + (it.poster ? "background-image:url('" + esc(it.poster) + "')" : "") + '"></div>' +
    '<div class="scrim"></div>' +
    '<div class="body">' +
      '<div class="kind">' + esc(it.kind) + "</div>" +
      "<h1>" + esc(it.title) + "</h1>" +
      '<div class="tag" id="tagLine"></div>' +
      '<div class="meta" id="metaLine">' + bits.join("") + "</div>" +
      (mk.length ? '<div style="margin-top:10px">' + mk.join("") + "</div>" : "") +
      '<p class="short">' + esc(it.descShort || "No synopsis available.") + "</p>" +
      '<div class="long">' + longHTML + "</div>" + note +
      '<div class="seasons" id="seasonStrip"></div>' +
    "</div>";
}

function otherName() {
  var o = state.users.filter(function (u) { return !state.me || u.id !== state.me.id; })[0];
  return o ? o.display_name : "They";
}

function paintDetail(it, d) {
  if (d.tagline) { var t = el("tagLine"); if (t) t.textContent = d.tagline; }
  if (d.runtime && !it.runtime) {
    it.runtime = d.runtime;
    var mm = el("metaLine");
    if (mm) mm.insertAdjacentHTML("beforeend", "<span>" + d.runtime + " min</span>");
  }
  if (d.imdb) it.imdb = d.imdb;
  var strip2 = el("seasonStrip");
  if (!strip2 || !d.seasons || !d.seasons.length) return;
  strip2.innerHTML = d.seasons.map(function (s, n) {
    return '<div class="season" data-s="' + n + '">' +
      '<div class="sp" style="' + (s.poster ? "background-image:url('" + esc(s.poster) + "')" : "") + '"></div>' +
      '<div class="sn">' + esc(s.name) + "</div>" +
      '<div class="se">' + (s.episodes ? s.episodes + " ep" : "") +
        (s.year ? (s.episodes ? " · " : "") + s.year : "") + "</div></div>";
  }).join("");
  Array.prototype.forEach.call(strip2.querySelectorAll(".season"), function (node) {
    node.onclick = function () {
      var s = d.seasons[parseInt(node.dataset.s, 10)];
      openSheet(s.name,
        (s.episodes ? '<p class="msg">' + s.episodes + " episodes" + (s.year ? ", from " + s.year : "") + "</p>" : "") +
        '<p class="short" style="margin-top:12px">' + esc(s.summary || "No season synopsis from this source.") + "</p>" +
        '<p class="credit">Per-episode rating and notes arrive in V1.</p>');
    };
  });
}

var card = null;
function current() { return state.queue[state.i]; }

function paintRail() {
  var it = current(); if (!it) return;
  var mi = state.mine[it.key] || blank();
  el("aWatched").className = "act" + (mi.watched ? " on" : "");
  el("aNote").className = "act" + (mi.note ? " on" : "");
  var rate = el("aRate");
  rate.className = "act" + (mi.rating != null ? " on" : "");
  rate.querySelector(".lbl").className = mi.rating != null ? "val" : "lbl";
  rate.querySelector(mi.rating != null ? ".val" : ".lbl").textContent =
    mi.rating != null ? mi.rating.toFixed(1) : "rate";
}

function render() {
  var it = current();
  if (!it) return;
  if (!card) {
    card = document.createElement("div");
    card.className = "card";
    el("stage").appendChild(card);
    bindGestures(card);
  }
  card.innerHTML = cardHTML(it);
  card.style.transition = "none";
  card.style.transform = "translate3d(0,0,0)";
  el("load").classList.add("off");
  paintRail();
  detailFor(it).then(function (d) { if (current() === it) paintDetail(it, d); });
  if (state.queue.length - state.i < 8) refill();
  var nx = state.queue[state.i + 1];
  if (nx && nx.poster) { var im = new Image(); im.src = nx.poster; }
}

function advance(dir) {
  var ni = state.i + dir;
  if (ni < 0) { bounce(); return; }
  if (ni >= state.queue.length) {
    refill().then(function () { if (state.queue[ni]) { state.i = ni; render(); } else bounce(); });
    return;
  }
  card.style.transition = "transform .22s cubic-bezier(.4,0,.6,1)";
  card.style.transform = "translate3d(0," + (dir > 0 ? "-100%" : "100%") + ",0)";
  setTimeout(function () { state.i = ni; render(); }, 210);
}
function bounce() {
  card.style.transition = "transform .18s ease-out";
  card.style.transform = "translate3d(0,-14px,0)";
  setTimeout(function () { card.style.transform = "translate3d(0,0,0)"; }, 170);
}

function flash(kind, text) {
  var f = el("flash");
  f.className = "flash on " + kind;
  f.textContent = text;
  setTimeout(function () { f.className = "flash " + kind; }, 520);
}

function collect(which) {
  var it = current();
  if (!it || !state.me) return;
  var kind = which === "sh" ? "playlist_shared" : "playlist_solo";
  var mi = mineOf(it.key);
  if (which === "sh") mi.shared = true; else mi.solo = true;
  counts();

  var th = state.theirs[it.key] || blank();
  var matched = which === "sh" && th.shared;
  flash(matched ? "mu" : which,
    matched ? "Match — " + otherName() + " wants this too"
            : (which === "sh" ? "Added to shared" : "Added to yours"));

  writeInteraction(it, kind).catch(function (e) {
    flash("so", "Saved locally only — " + e.message);
  });

  card.style.transition = "transform .2s ease-out";
  card.style.transform = "translate3d(" + (which === "sh" ? "34%" : "-34%") + ",0,0)";
  setTimeout(function () { advance(1); }, 190);
}

function counts() {
  var sh = 0, so = 0;
  for (var k in state.mine) {
    if (state.mine[k].shared) sh++;
    if (state.mine[k].solo) so++;
  }
  el("pSh").innerHTML = "Shared <b>" + sh + "</b>";
  el("pSo").innerHTML = "Mine <b>" + so + "</b>";
  el("pMu").innerHTML = "Both <b>" + mutualKeys().length + "</b>";
}

/* -------------------------------------------------------------- gestures */

function bindGestures(node) {
  var sx = 0, sy = 0, dx = 0, dy = 0, drag = false, axis = null, scrolled = false;
  node.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    dx = dy = 0; drag = true; axis = null;
    var b = node.querySelector(".body");
    scrolled = b ? b.scrollTop > 2 : false;
    node.style.transition = "none";
  }, { passive: true });
  node.addEventListener("touchmove", function (e) {
    if (!drag) return;
    dx = e.touches[0].clientX - sx; dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      else return;
    }
    if (axis === "y" && scrolled) return;
    e.preventDefault();
    node.style.transform = axis === "x"
      ? "translate3d(" + dx + "px,0,0) rotate(" + (dx / 44) + "deg)"
      : "translate3d(0," + dy * 0.9 + "px,0)";
  }, { passive: false });
  node.addEventListener("touchend", function () {
    if (!drag) return;
    drag = false;
    var TH = 66;
    if (axis === "x" && Math.abs(dx) > TH) { collect(dx > 0 ? "sh" : "so"); return; }
    if (axis === "y" && !scrolled && Math.abs(dy) > TH) { advance(dy < 0 ? 1 : -1); return; }
    node.style.transition = "transform .2s cubic-bezier(.3,.9,.3,1)";
    node.style.transform = "translate3d(0,0,0)";
  }, { passive: true });
}

document.addEventListener("keydown", function (e) {
  if (el("sheet").classList.contains("on")) { if (e.key === "Escape") closeSheet(); return; }
  if (el("gate").classList.contains("on")) return;
  if (e.key === "ArrowUp") advance(-1);
  else if (e.key === "ArrowDown") advance(1);
  else if (e.key === "ArrowRight") collect("sh");
  else if (e.key === "ArrowLeft") collect("so");
});

/* ---------------------------------------------------------------- sheets */

function openSheet(title, html) {
  el("shHead").querySelector("h2").textContent = title;
  el("shBody").innerHTML = html;
  el("sheet").classList.add("on");
  el("veil").classList.add("on");
}
function closeSheet() {
  el("sheet").classList.remove("on");
  el("veil").classList.remove("on");
}
el("shClose").onclick = closeSheet;
el("veil").onclick = closeSheet;

el("cLeft").onclick = function () {
  var it = current(); if (!it) return;
  openSheet("Cast", '<p class="msg">Loading…</p>');
  detailFor(it).then(function (d) {
    if (!d.cast.length) { openSheet("Cast", '<p class="msg">No cast listed at the source.</p>'); return; }
    var rows = d.cast.map(function (c) {
      return '<div class="crow">' +
        (c.img ? '<img src="' + esc(c.img) + '" alt="">' : '<div class="ph"></div>') +
        "<div><div class='nm'>" + esc(c.name) + "</div>" +
        (c.character ? "<div class='ch'>as " + esc(c.character) + "</div>" : "") + "</div>" +
        "<div class='rk'>" + c.rank + "</div></div>";
    }).join("");
    var how = d.ranked === "popularity" ? "Ranked by TMDB person popularity, not billing order."
      : d.ranked === "favourites" ? "Characters in MyAnimeList favourite order, with the Japanese voice actor."
      : "Ordered by billing, which is all this source exposes.";
    openSheet("Cast", rows + '<p class="credit">' + how + "</p>");
  });
};

el("cRight").onclick = function () {
  var it = current(); if (!it) return;
  var rows = [], mi = state.mine[it.key] || blank();
  function row(src, val, sub, scale) {
    rows.push('<div class="rrow"><div class="src">' + src +
      (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" +
      (val == null ? '<div class="abs">not available</div>'
        : '<div class="val">' + val + '<span style="font-size:12px;color:#6a6963">' + scale + "</span></div>") + "</div>");
  }
  if (it.source === "tmdb") row("TMDB", it.ratings.tmdb, it.ratings.tmdbVotes ? it.ratings.tmdbVotes.toLocaleString() + " votes" : "", "/10");
  if (it.source === "tvmaze") row("TVMaze", it.ratings.tvmaze, "community average", "/10");
  if (it.source === "mal") row("MyAnimeList", it.ratings.mal, it.ratings.malVotes ? it.ratings.malVotes.toLocaleString() + " votes" : "", "/10");
  row("IMDb", null, it.imdb ? it.imdb + " — needs the nightly dump" : "no id from this source", "/10");
  row("Metacritic", null, "needs an OMDb key", "/100");
  row("Letterboxd", null, "API access requested", "/5");
  row("Rotten Tomatoes", null, "agent fetch, once you interact", "%");
  row("You", mi.rating, mi.rating != null ? "your rating" : "not rated yet", "/5");
  openSheet("Ratings", rows.join("") +
    '<p class="credit">Absent is a real state, not an error. Each row fills in as its source comes online.</p>');
};

/* ------------------------------------------------------------ the actions */

el("aWatched").onclick = function () {
  var it = current(); if (!it || !state.me) return;
  var mi = mineOf(it.key);
  if (mi.watched) {
    mi.watched = false; paintRail();
    dropInteraction(it, "watched").catch(function () {});
    flash("so", "Unmarked");
  } else {
    mi.watched = true; paintRail();
    writeInteraction(it, "watched").catch(function (e) { flash("so", "Failed: " + e.message); });
    flash("sh", "Marked watched");
  }
  render();
};

var RATINGS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];

function rateSheet(it, picked) {
  var mi = state.mine[it.key] || blank();
  var sel = picked != null ? picked : mi.rating;
  var same = sel == null ? [] : state.ratings.filter(function (r) {
    return r.value === sel && r.key !== it.key;
  });

  function build() {
    var stars = RATINGS.map(function (v) {
      return '<div class="star' + (v === sel ? " sel" : "") + '" data-v="' + v + '">' + v.toFixed(1) + "</div>";
    }).join("");
    var panel = "";
    if (sel != null) {
      if (same.length) {
        panel = '<p class="msg" style="margin-top:18px">You have rated ' + same.length +
          " other " + (same.length === 1 ? "title" : "titles") + " exactly " + sel.toFixed(1) + ":</p>" +
          same.slice(0, 30).map(function (r) {
            var mrec = mediaCache[r.key] || {};
            return '<div class="lrow"><div class="lt">' + esc(mrec.title || r.key) + "</div>" +
              '<div class="ly">' + (mrec.year || "") + "</div></div>";
          }).join("");
      } else {
        panel = '<p class="msg" style="margin-top:18px">Nothing else sits at ' + sel.toFixed(1) +
          " yet. This title defines the shelf.</p>";
      }
    }
    openSheet("Rate — " + it.title,
      '<div class="stars">' + stars + "</div>" + panel +
      '<div><button class="f" id="rSave"' + (sel == null ? " disabled" : "") + ">Save " +
        (sel != null ? sel.toFixed(1) : "") + "</button>" +
      (mi.rating != null ? '<button class="f g" id="rClear">Clear</button>' : "") + "</div>" +
      '<p class="credit">Half-star steps. The list above is the check against your own past judgement, ' +
      "before you commit this one.</p>");

    Array.prototype.forEach.call(el("shBody").querySelectorAll(".star"), function (node) {
      node.onclick = function () { rateSheet(it, parseFloat(node.dataset.v)); };
    });
    el("rSave").onclick = function () {
      if (sel == null) return;
      mi = mineOf(it.key);
      mi.rating = sel;
      var exist = state.ratings.filter(function (r) { return r.key === it.key; })[0];
      if (exist) exist.value = sel; else state.ratings.push({ key: it.key, value: sel });
      mediaCache[it.key] = { title: it.title, year: it.year, kind: it.kind, poster: it.poster };
      paintRail(); closeSheet(); render();
      writeInteraction(it, "rating", sel).catch(function (e) { flash("so", "Failed: " + e.message); });
    };
    if (el("rClear")) el("rClear").onclick = function () {
      mineOf(it.key).rating = null;
      state.ratings = state.ratings.filter(function (r) { return r.key !== it.key; });
      paintRail(); closeSheet(); render();
      dropInteraction(it, "rating").catch(function () {});
    };
  }

  loadMediaRows(same.map(function (r) { return r.key; })).then(build);
}

el("aRate").onclick = function () {
  var it = current(); if (!it || !state.me) return;
  rateSheet(it, null);
};

el("aNote").onclick = function () {
  var it = current(); if (!it || !state.me) return;
  var mi = state.mine[it.key] || blank();
  openSheet("Note — " + it.title,
    '<label class="f" for="nt">Your note</label>' +
    '<textarea class="f" id="nt" rows="5" placeholder="What you want to remember about it.">' +
      esc(mi.note || "") + "</textarea>" +
    '<div><button class="f" id="nSave">Save</button>' +
    (mi.note ? '<button class="f g" id="nDel">Delete</button>' : "") + "</div>" +
    '<p class="credit">Notes are yours alone. ' + esc(otherName()) + " does not see them.</p>");
  el("nSave").onclick = function () {
    var v = el("nt").value.trim();
    if (!v) { el("nt").focus(); return; }
    mineOf(it.key).note = v;
    paintRail(); closeSheet(); render();
    writeInteraction(it, "note", v).catch(function (e) { flash("so", "Failed: " + e.message); });
  };
  if (el("nDel")) el("nDel").onclick = function () {
    mineOf(it.key).note = null;
    paintRail(); closeSheet(); render();
    dropInteraction(it, "note").catch(function () {});
  };
};

/* ----------------------------------------------------------------- lists */

function listRows(keys, mode) {
  return keys.map(function (k) {
    var rec = mediaCache[k] || {}, mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
    var bars = [];
    if (mi.shared || th.shared) bars.push('<i style="background:#1D9E75"></i>');
    if (mi.solo) bars.push('<i style="background:#7F77DD"></i>');
    var who = "";
    if (mode === "shared") {
      if (mi.shared && th.shared) who = '<div class="who" style="background:rgba(239,159,39,.25);color:#fac775">2</div>';
      else if (th.shared) who = '<div class="who" style="background:rgba(29,158,117,.22);color:#9fe1cb">' +
        esc((otherName() || "?").charAt(0)) + "</div>";
      else who = '<div class="who" style="background:rgba(29,158,117,.22);color:#9fe1cb">' +
        esc(state.me ? state.me.initial : "?") + "</div>";
    }
    return '<div class="lrow"><div class="lbar">' + (bars.join("") || '<i style="background:#333"></i>') + "</div>" +
      '<div class="lt">' + esc(rec.title || k) +
      (mi.rating != null ? ' <span style="color:#5dcaa5;font-size:12px">' + mi.rating.toFixed(1) + "</span>" : "") +
      "</div>" + who + '<div class="ly">' + (rec.year || "") + "</div></div>";
  }).join("");
}

function showList(mode) {
  var keys = [], title;
  if (mode === "mutual") {
    keys = mutualKeys(); title = "Both want this";
  } else if (mode === "shared") {
    var set = {};
    for (var k in state.mine) if (state.mine[k].shared) set[k] = 1;
    for (var k2 in state.theirs) if (state.theirs[k2].shared) set[k2] = 1;
    keys = Object.keys(set); title = "Shared list";
  } else {
    for (var k3 in state.mine) if (state.mine[k3].solo) keys.push(k3);
    title = "Only me";
  }
  if (!keys.length) {
    openSheet(title, '<p class="msg">Nothing here yet.</p>');
    return;
  }
  openSheet(title, '<p class="msg">Loading…</p>');
  loadMediaRows(keys).then(function () {
    openSheet(title, listRows(keys, mode) +
      '<p class="credit">' + (mode === "mutual"
        ? "Titles you have both swiped right. This is the list that decides what you watch together."
        : mode === "shared"
          ? "Everything either of you put forward. A single initial is a request; a 2 is a match."
          : "Yours alone. " + esc(otherName()) + " never sees this list.") + "</p>");
  });
}
el("pMu").onclick = function () { showList("mutual"); };
el("pSh").onclick = function () { showList("shared"); };
el("pSo").onclick = function () { showList("solo"); };

/* -------------------------------------------------------------- settings */

function settingsSheet(msg) {
  openSheet("Settings",
    '<p class="msg good">Signed in as ' + esc(state.me ? state.me.display_name : "nobody") + "</p>" +
    '<p class="msg">Worker: ' + (worker ? esc(worker) : "not set — TVMaze and MyAnimeList only") + "</p>" +
    '<label class="f" for="wk">Cloudflare worker URL</label>' +
    '<input class="f" id="wk" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
      'spellcheck="false" value="' + esc(worker) + '">' +
    '<div><button class="f" id="wkSave">Save and test</button>' +
    '<button class="f g" id="swap">Switch person</button></div>' +
    (msg || "") +
    '<p class="credit">Your TMDB token lives as a secret on the worker, never in this page. ' +
    'Data from TVMaze (CC BY-SA), MyAnimeList via Jikan, and TMDB. ' +
    'This product uses the TMDB API but is not endorsed or certified by TMDB.</p>');

  el("wkSave").onclick = function () {
    var v = (el("wk").value || "").trim().replace(/\/+$/, "");
    if (v && !/^https:\/\/[^\s]+$/.test(v)) { settingsSheet('<p class="msg bad">Not an https URL.</p>'); return; }
    el("wkSave").textContent = "Testing…";
    var check = v ? getJSON(v + "/tmdb/configuration") : Promise.resolve();
    check.then(function () {
      worker = v;
      try { localStorage.setItem(K_WORKER, v || "none"); } catch (e) {}
      state.queue = []; state.i = 0; state.detail = {}; state.genres = {};
      closeSheet(); el("load").classList.remove("off");
      refill().then(function () { if (state.queue.length) render(); });
    }).catch(function () {
      settingsSheet('<p class="msg bad">The worker answered with an error. Check TMDB_TOKEN and ALLOWED_ORIGIN.</p>');
    });
  };
  el("swap").onclick = function () {
    try { localStorage.removeItem(K_ME); } catch (e) {}
    location.reload();
  };
}
el("pCog").onclick = function () { settingsSheet(); };

/* ------------------------------------------------------------------ gate */

function showGate() {
  var btns = state.users.map(function (u) {
    return '<button class="who-btn" data-id="' + esc(u.id) + '">' +
      '<span class="av" style="background:' + esc(u.bar_colour) + '">' + esc(u.initial) + "</span>" +
      '<span class="nm">' + esc(u.display_name) + "</span></button>";
  }).join("");
  el("gate").innerHTML = "<h3>Who's swiping?</h3>" +
    "<p>This is stored on this device. You can switch from settings.</p>" + btns;
  el("gate").classList.add("on");
  el("load").classList.add("off");
  Array.prototype.forEach.call(el("gate").querySelectorAll(".who-btn"), function (node) {
    node.onclick = function () {
      var u = state.users.filter(function (x) { return x.id === node.dataset.id; })[0];
      state.me = u;
      try { localStorage.setItem(K_ME, JSON.stringify(u)); } catch (e) {}
      el("gate").classList.remove("on");
      el("load").classList.remove("off");
      start();
    };
  });
}

/* ------------------------------------------- one-time local swipe import */

function importLegacy() {
  var raw;
  try { raw = localStorage.getItem(K_LEGACY); } catch (e) { return Promise.resolve(); }
  if (!raw) return Promise.resolve();
  var old;
  try { old = JSON.parse(raw); } catch (e) { return Promise.resolve(); }
  var jobs = [];
  ["shared", "solo"].forEach(function (b) {
    Object.keys(old[b] || {}).forEach(function (k) {
      var v = old[b][k];
      jobs.push({ key: k, kind: b === "shared" ? "playlist_shared" : "playlist_solo", v: v });
    });
  });
  if (!jobs.length) { try { localStorage.removeItem(K_LEGACY); } catch (e) {} return Promise.resolve(); }
  var mediaRows = {}, inter = [];
  jobs.forEach(function (j) {
    mediaRows[j.key] = { key: j.key, source: j.key.split(":")[0], kind: j.v.kind || "movie",
      title: j.v.title || j.key, year: j.v.year || null, poster: null };
    inter.push({ user_id: state.me.id, media_key: j.key, kind: j.kind, value: null });
  });
  return sbUpsert("media", Object.keys(mediaRows).map(function (k) { return mediaRows[k]; }), "key")
    .then(function () { return sbUpsert("interaction", inter, "user_id,media_key,kind"); })
    .then(function () { try { localStorage.removeItem(K_LEGACY); } catch (e) {} })
    .catch(function () {});
}

/* ------------------------------------------------------------------ boot */

var booted = false;

function failScreen(headline) {
  if (booted) return;
  var order = ["db", "genres", "movies", "shows", "tvmaze", "anime"];
  var lines = order.filter(function (k) { return state.diag[k]; })
    .map(function (k) { return k + " — " + esc(state.diag[k]); });
  el("load").innerHTML =
    '<p style="font-size:14px;color:#cfcdc5;text-align:center;padding:0 32px;line-height:1.6">' + esc(headline) + "</p>" +
    (lines.length ? '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px;line-height:1.8;font-family:ui-monospace,monospace">' + lines.join("<br>") + "</p>"
      : '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px">No source reported an error, which usually means the requests never returned.</p>') +
    '<div style="display:flex;gap:8px;margin-top:4px"><button class="f" id="btnRetry">Retry</button>' +
    '<button class="f g" id="btnNoTmdb">Run without TMDB</button></div>';
  el("btnRetry").onclick = function () { location.reload(); };
  el("btnNoTmdb").onclick = function () {
    try { localStorage.setItem(K_WORKER, "none"); } catch (e) {}
    location.reload();
  };
}

function start() {
  setTimeout(function () { failScreen("Timed out waiting for the sources."); }, 16000);
  loadMine()
    .then(importLegacy)
    .then(loadMine)
    .then(function () { counts(); return refill(); })
    .then(function () {
      if (!state.queue.length) { failScreen("No source returned anything."); return; }
      booted = true;
      render();
    })
    .catch(function (e) { failScreen("The feed failed to start: " + (e && e.message ? e.message : "unknown")); });
}

sbGet("app_user?select=id,handle,display_name,initial,bar_colour&order=created_at").then(function (rows) {
  state.users = rows || [];
  if (!state.users.length) { failScreen("No people in the database. Run the seed in schema.sql."); return; }
  if (state.me) {
    var still = state.users.filter(function (u) { return u.id === state.me.id; })[0];
    if (still) { state.me = still; start(); return; }
  }
  showGate();
}).catch(function (e) {
  state.diag.db = e.message;
  failScreen("Could not reach Supabase.");
});
</script>
