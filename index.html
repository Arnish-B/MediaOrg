<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0c;color:#f2f1ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden}

.card{position:absolute;inset:0;will-change:transform;touch-action:none;
  backface-visibility:hidden;transform:translate3d(0,0,0)}
.card.anim{transition:transform .26s cubic-bezier(.22,.61,.36,1)}
.poster{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#17171b;transform:translateZ(0)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,12,.97) 0%,rgba(10,10,12,.9) 24%,rgba(10,10,12,.4) 48%,rgba(10,10,12,.12) 70%,rgba(10,10,12,.5) 100%)}

.body{position:absolute;left:0;right:0;bottom:0;
  padding:0 86px calc(86px + env(safe-area-inset-bottom)) 20px}
.kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5dcaa5;margin-bottom:6px}
h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.tag{font-size:13px;color:#8d8b83;margin-top:5px;font-style:italic}
.meta{font-size:12.5px;color:#9a988f;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.meta span:not(:last-child)::after{content:"·";margin-left:8px;color:#55544e}
.chips{margin-top:9px}
.chip{font-size:10.5px;padding:2px 8px;border-radius:5px;margin-right:4px;display:inline-block}

#desc{position:relative;margin-top:12px;max-height:25vh;overflow:hidden;
  transition:max-height .22s ease}
#desc.open{max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:4px;touch-action:pan-y}
#desc::-webkit-scrollbar{width:3px}
#desc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:2px}
.short{font-size:15px;line-height:1.5;color:#e4e2dc}
.long{font-size:13.5px;line-height:1.62;margin-top:12px;color:#a8a69d;display:none}
#desc.open .long{display:block}
.long p{margin-bottom:9px}
.samenote{font-size:11.5px;color:#6a6963;margin-top:9px;font-style:italic;display:none}
#desc.open .samenote{display:block}
#fade{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,12,.95),rgba(10,10,12,0))}
#desc.open #fade{display:none}
#more{display:inline-block;margin-top:7px;font-size:13px;color:#9a988f;cursor:pointer;
  font-weight:500;padding:3px 0}

.seasons{display:flex;gap:10px;overflow-x:auto;margin-top:14px;padding-bottom:4px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.seasons::-webkit-scrollbar{display:none}
.season{flex:0 0 92px;scroll-snap-align:start;cursor:pointer}
.season .sp{width:92px;height:132px;border-radius:8px;background:#1d1d22;
  background-size:cover;background-position:center}
.season .sn{font-size:11.5px;margin-top:5px;font-weight:500}
.season .se{font-size:10.5px;color:#85837b;margin-top:1px}

.corner{position:fixed;top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;
  border-radius:50%;background:rgba(18,18,22,.72);backdrop-filter:blur(14px);
  border:.5px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:6}
#cLeft{left:14px}#cRight{right:14px}
.corner svg{width:19px;height:19px;stroke:#e8e6e0;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

#rail{position:fixed;right:12px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:6;
  display:flex;flex-direction:column;gap:17px;align-items:center}
.act{width:50px;height:50px;border-radius:50%;background:rgba(18,18,22,.66);
  backdrop-filter:blur(14px);border:.5px solid rgba(255,255,255,.13);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.act svg{width:23px;height:23px;stroke:#e8e6e0;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.act.on{border-color:#5dcaa5}
.act.on svg{stroke:#5dcaa5}
.act .lbl{position:absolute;bottom:-14px;font-size:10px;color:#9a988f;white-space:nowrap}
.act.on .lbl{color:#5dcaa5;font-weight:600}

#aWatched .shut{opacity:0}
#aWatched.on .open,#aWatched.blink .open{opacity:0}
#aWatched.on .shut,#aWatched.blink .shut{opacity:1}
#aWatched .open,#aWatched .shut{position:absolute;transition:opacity .18s}
#aWatched.blink .shut{animation:lidshut .95s cubic-bezier(.4,0,.2,1)}
@keyframes lidshut{
  0%{transform:scaleY(1)}
  22%{transform:scaleY(.08)}
  45%{transform:scaleY(.08)}
  62%{transform:scaleY(.55)}
  100%{transform:scaleY(1)}
}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:7;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
  background:linear-gradient(to top,rgba(10,10,12,.96),rgba(10,10,12,0));
  display:flex;align-items:center;gap:7px}
.pill{font-size:12px;padding:6px 11px;border-radius:999px;border:.5px solid rgba(255,255,255,.16);
  background:rgba(22,22,26,.75);color:#cfcdc5;cursor:pointer;white-space:nowrap}
.pill b{font-weight:600;color:#fff}
.pill.sh{border-color:rgba(93,202,165,.55)}
.pill.so{border-color:rgba(175,169,236,.55)}
.pill.mu{border-color:rgba(239,159,39,.6);color:#fac775}
#pMe{margin-left:auto;width:32px;height:32px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#07140f;
  cursor:pointer;flex:0 0 32px}

.flash{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;
  pointer-events:none;opacity:0;display:flex;justify-content:center;transition:opacity .18s}
.flash.on{opacity:1}
.flash span{font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;
  backdrop-filter:blur(14px)}
.flash.sh span{background:rgba(29,158,117,.9);color:#04342c}
.flash.so span{background:rgba(127,119,221,.9);color:#1b1733}
.flash.mu span{background:rgba(239,159,39,.94);color:#412402}

#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;z-index:12;
  background:#131317;border-radius:18px 18px 0 0;border-top:.5px solid rgba(255,255,255,.1);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#shHead{padding:16px 20px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:.5px solid rgba(255,255,255,.08)}
#shHead h2{font-size:16px;font-weight:600;flex:1}
#shClose{font-size:22px;color:#85837b;cursor:pointer;line-height:1;padding:0 4px}
#shBody{padding:8px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;opacity:0;
  pointer-events:none;transition:opacity .22s}
#veil.on{opacity:1;pointer-events:auto}

.crow{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.crow img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#22222a;flex:0 0 42px}
.crow .ph{width:42px;height:42px;border-radius:50%;background:#22222a;flex:0 0 42px}
.crow .nm{font-size:14.5px;font-weight:500}
.crow .ch{font-size:12.5px;color:#908e86;margin-top:1px}
.crow .rk{font-size:11px;color:#55544e;margin-left:auto;font-variant-numeric:tabular-nums}
.rrow{display:flex;align-items:baseline;gap:10px;padding:12px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.rrow .src{font-size:13.5px;color:#cfcdc5;flex:1}
.rrow .val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rrow .abs{font-size:12.5px;color:#55544e;font-style:italic}
.rrow .sub{font-size:11px;color:#6a6963;margin-top:2px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:.5px solid rgba(255,255,255,.06)}
.lbar{width:3px;height:36px;flex:0 0 3px;display:flex;flex-direction:column;overflow:hidden}
.lbar i{flex:1}
.lrow .lt{font-size:14px;flex:1;line-height:1.3}
.lrow .ly{font-size:12px;color:#6a6963}
.lrow .who{font-size:10px;width:19px;height:19px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:600;flex:0 0 19px}

.stars{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.star{flex:0 0 calc(20% - 6px);padding:12px 0;border-radius:10px;background:#1b1b21;
  border:.5px solid rgba(255,255,255,.1);text-align:center;font-size:15px;font-weight:600;
  cursor:pointer;font-variant-numeric:tabular-nums}
.star.sel{background:#1d9e75;color:#04342c;border-color:#1d9e75}

label.f{display:block;font-size:12px;color:#908e86;margin:16px 0 6px}
input.f,textarea.f{width:100%;padding:11px 13px;border-radius:9px;background:#1b1b21;color:#f2f1ee;
  border:.5px solid rgba(255,255,255,.14);font-size:14px;font-family:inherit;resize:vertical}
input.f:focus,textarea.f:focus{outline:none;border-color:#5dcaa5}
button.f{margin-top:14px;padding:11px 18px;border-radius:9px;background:#1d9e75;color:#04342c;
  border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
button.g{background:transparent;color:#cfcdc5;border:.5px solid rgba(255,255,255,.18);
  margin-left:8px;font-weight:500}
button.f:disabled{opacity:.45}
.msg{font-size:12.5px;margin-top:10px;line-height:1.55;color:#908e86}
.msg.bad{color:#f09595}
.msg.good{color:#9fe1cb}

#prof{position:fixed;inset:0;z-index:18;background:#0a0a0c;display:none;flex-direction:column}
#prof.on{display:flex}
#pfHead{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;
  align-items:center;gap:11px;border-bottom:.5px solid rgba(255,255,255,.08)}
#pfHead .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:600;font-size:15px;color:#07140f}
#pfHead .nm{font-size:17px;font-weight:600;flex:1}
#pfHead .x{font-size:24px;color:#85837b;cursor:pointer;padding:0 6px;line-height:1}
#pfTabs{display:flex;gap:6px;padding:11px 18px;border-bottom:.5px solid rgba(255,255,255,.07)}
.tab{font-size:13px;padding:7px 15px;border-radius:999px;cursor:pointer;
  border:.5px solid rgba(255,255,255,.14);color:#9a988f}
.tab.on{background:#f2f1ee;color:#111;border-color:#f2f1ee;font-weight:600}
#pfBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 0 calc(28px + env(safe-area-inset-bottom))}

.tier{margin-bottom:20px}
.tierHead{display:flex;align-items:baseline;gap:9px;padding:0 18px 8px}
.tierHead .tl{font-size:15px;font-weight:600;cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.2)}
.tierHead .tb{font-size:11px;color:#6a6963;font-variant-numeric:tabular-nums}
.tierHead .tc{font-size:11px;color:#6a6963;margin-left:auto}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.tile{flex:0 0 74px;cursor:pointer}
.tile .tp{width:74px;height:106px;border-radius:7px;background:#1b1b21;
  background-size:cover;background-position:center}
.tile .tt{font-size:10.5px;color:#9a988f;margin-top:4px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{font-size:12px;color:#55544e;padding:0 18px 4px}

#filters{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px;-webkit-overflow-scrolling:touch}
#filters::-webkit-scrollbar{display:none}
.fch{font-size:11.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;
  border:.5px solid rgba(255,255,255,.14);color:#9a988f;background:transparent}
.fch.on{background:#2a2a32;color:#f2f1ee;border-color:#45454f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;padding:0 18px}
.gcell{cursor:pointer}
.gcell .gp{width:100%;aspect-ratio:2/3;border-radius:8px;background:#1b1b21;
  background-size:cover;background-position:center;position:relative}
.gcell .gr{position:absolute;right:5px;bottom:5px;font-size:10.5px;font-weight:700;
  background:rgba(10,10,12,.86);color:#5dcaa5;padding:2px 6px;border-radius:5px}
.gcell .gt{font-size:11px;color:#cfcdc5;margin-top:5px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

#gate{position:fixed;inset:0;z-index:30;background:#0a0a0c;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 28px}
#gate.on{display:flex}
#gate h3{font-size:19px;font-weight:600}
#gate p{font-size:13px;color:#85837b;text-align:center;line-height:1.6;margin-bottom:12px}
.who-btn{width:100%;max-width:300px;padding:15px 18px;border-radius:12px;background:#17171d;
  border:.5px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:12px;
  cursor:pointer;font-family:inherit}
.who-btn .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:600;font-size:14px;color:#07140f}
.who-btn .nm{font-size:15.5px;color:#f2f1ee}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:20;background:#0a0a0c;transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#load .ring{width:34px;height:34px;border-radius:50%;border:2px solid #2a2a32;
  border-top-color:#5dcaa5;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{font-size:13px;color:#6a6963}
.credit{font-size:11px;color:#4a4945;line-height:1.6;margin-top:16px}
@media (prefers-reduced-motion:reduce){
  .card.anim{transition:none}
  #aWatched.blink .shut{animation:none}
}
</style>
</head>
<body>

<div id="stage"></div>

<div class="corner" id="cLeft" role="button" aria-label="Cast">
  <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c0-3.6 2.9-5.6 6.4-5.6s6.4 2 6.4 5.6"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6.1"/><path d="M18.6 14.8c2 .7 3.4 2.3 3.4 5.2"/></svg>
</div>
<div class="corner" id="cRight" role="button" aria-label="Ratings">
  <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>
</div>

<div id="rail">
  <div class="act" id="aWatched" role="button" aria-label="Watched">
    <svg class="open" viewBox="0 0 24 24"><path d="M1.8 12S5.4 5.4 12 5.4 22.2 12 22.2 12 18.6 18.6 12 18.6 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.1"/></svg>
    <svg class="shut" viewBox="0 0 24 24"><path d="M2.2 10.4c2.4 3.2 5.7 5 9.8 5s7.4-1.8 9.8-5"/><path d="M4.6 14.1 3 16.6"/><path d="M9 15.9l-.7 2.7"/><path d="M15 15.9l.7 2.7"/><path d="M19.4 14.1 21 16.6"/></svg>
    <span class="lbl">watched</span>
  </div>
  <div class="act" id="aRate" role="button" aria-label="Rate">
    <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>
    <span class="lbl">rate</span>
  </div>
  <div class="act" id="aNote" role="button" aria-label="Note">
    <svg viewBox="0 0 24 24"><path d="M20.4 14.4a2 2 0 0 1-2 2H7.2L3.6 20V5.2a2 2 0 0 1 2-2h12.8a2 2 0 0 1 2 2z"/></svg>
    <span class="lbl">note</span>
  </div>
</div>

<div id="bar">
  <div class="pill mu" id="pMu">Both <b>0</b></div>
  <div class="pill sh" id="pSh">Shared <b>0</b></div>
  <div class="pill so" id="pSo">Mine <b>0</b></div>
  <div id="pMe" role="button" aria-label="Profile">?</div>
</div>

<div class="flash" id="flash"><span></span></div>
<div id="veil"></div>
<div id="sheet">
  <div id="shHead"><h2>—</h2><div id="shClose" role="button" aria-label="Close">×</div></div>
  <div id="shBody"></div>
</div>

<div id="prof">
  <div id="pfHead">
    <div class="av" id="pfAv">?</div>
    <div class="nm" id="pfNm">—</div>
    <div class="x" id="pfX" role="button" aria-label="Close">×</div>
  </div>
  <div id="pfTabs">
    <div class="tab on" data-t="tiers">Tier list</div>
    <div class="tab" data-t="library">Library</div>
    <div class="tab" data-t="settings">Settings</div>
  </div>
  <div id="pfBody"></div>
</div>

<div id="gate"></div>
<div id="load"><div class="ring"></div><p>Loading the feed</p></div>

/* ------------------------------------------------------------- supabase */

function sbHeaders(extra) {

  for (var k in (extra || {})) h[k] = extra[k];

}
function sbGet(path) { return getJSON(SUPA_URL + "/rest/v1/" + path, 12000, { headers: sbHeaders() }); }
function sbUpsert(table, rows, conflict) {

    method: "POST", headers: sbHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(rows)

    method: "PATCH", headers: sbHeaders({ Prefer: "return=minimal" }), body: JSON.stringify(patch)
  });
}
function sbDelete(table, query) {
  return getJSON(SUPA_URL + "/rest/v1/" + table + "?" + query, 12000, {
    method: "DELETE", headers: sbHeaders({ Prefer: "return=minimal" })

}

/* ---------------------------------------------- local model of the rows */

function blank() { return { shared: false, solo: false, watched: false, rating: null, note: null }; }
function mineOf(key) { return state.mine[key] || (state.mine[key] = blank()); }

function applyRow(bucket, row) {
  var m = bucket[row.media_key] || (bucket[row.media_key] = blank());
  if (row.kind === "playlist_shared") m.shared = true;
  else if (row.kind === "playlist_solo") m.solo = true;
  else if (row.kind === "watched") m.watched = true;
  else if (row.kind === "rating") m.rating = Number(row.value);
  else if (row.kind === "note") m.note = row.value;
}

function loadMine() {
  if (!state.me) return Promise.resolve();
  return sbGet("interaction?select=user_id,media_key,kind,value").then(function (rows) {
    state.mine = {}; state.theirs = {}; state.ratings = [];
    (rows || []).forEach(function (r) {
      if (r.user_id === state.me.id) {
        applyRow(state.mine, r);
        if (r.kind === "rating") state.ratings.push({ key: r.media_key, value: Number(r.value) });
      } else applyRow(state.theirs, r);
    });
  }).catch(function (e) { state.diag.db = e.message; });
}

function loadTiers() {
  if (!state.me) return Promise.resolve();
  return sbGet("tier?user_id=eq." + state.me.id + "&select=idx,label,lower_bound,upper_bound&order=idx.desc")
    .then(function (rows) { state.tiers = rows || []; })
    .catch(function () { state.tiers = []; });
}

function mutualKeys() {
  var out = [];
  for (var k in state.mine) {
    if (state.mine[k].shared && state.theirs[k] && state.theirs[k].shared) out.push(k);
  }
  return out;
}

var mediaCache = {};
function rememberMedia(it) {
  mediaCache[it.key] = { key: it.key, title: it.title, year: it.year, kind: it.kind,
    poster: it.poster, genres: it.genres || [] };
  return sbUpsert("media", [{
    key: it.key, source: it.source, kind: it.kind, title: it.title,
    year: it.year, poster: it.poster, genres: it.genres || []
  }], "key");
}
function writeInteraction(it, kind, value) {
  return rememberMedia(it).then(function () {
    return sbUpsert("interaction", [{
      user_id: state.me.id, media_key: it.key, kind: kind,
      value: value === undefined ? null : value, updated_at: new Date().toISOString()
    }], "user_id,media_key,kind");
  });
}
function dropInteraction(it, kind) {
  return sbDelete("interaction",
    "user_id=eq." + state.me.id + "&media_key=eq." + encodeURIComponent(it.key) + "&kind=eq." + kind);
}
function loadMediaRows(keys) {
  var need = keys.filter(function (k) { return !mediaCache[k]; });
  if (!need.length) return Promise.resolve();
  var list = need.map(function (k) { return '"' + k + '"'; }).join(",");
  return sbGet("media?select=key,title,year,kind,poster,genres&key=in.(" + encodeURIComponent(list) + ")")
    .then(function (rows) { (rows || []).forEach(function (r) { mediaCache[r.key] = r; }); })
    .catch(function () {});
}

/* ---------------------------------------------------------- throttles */

function gate(ms) {
  var last = 0;
  return function () {
    var wait = Math.max(0, ms - (Date.now() - last));
    last = Date.now() + wait;
    return new Promise(function (r) { setTimeout(r, wait); });
  };
}
var gTmdb = gate(260), gJikan = gate(420);
function tmdb(path, params) {
  if (!worker) return Promise.reject(new Error("no worker"));
  var q = new URLSearchParams(params || {}).toString();
  return gTmdb().then(function () { return getJSON(worker + "/tmdb/" + path + (q ? "?" + q : "")); });
}

/* ------------------------------------------------------------ adapters */

function genreNames(ids, kind) {

}

function fromTvmaze(s) {

/* ---------------------------------------------------------------- pools */

function loadGenres() {
  if (!worker || state.genres.movie) return Promise.resolve();
  return Promise.all([tmdb("genre/movie/list"), tmdb("genre/tv/list")]).then(function (r) {
    state.genres.movie = {}; state.genres.tv = {};
    (r[0].genres || []).forEach(function (g) { state.genres.movie[g.id] = g.name; });
    (r[1].genres || []).forEach(function (g) { state.genres.tv[g.id] = g.name; });
  }).catch(function (e) { state.diag.genres = e.message; });
}
function loadTmdbMovies() {
  return tmdb("discover/movie", { sort_by: "popularity.desc", page: 1 + rnd(45),
    "vote_count.gte": 400, include_adult: false, language: "en-US" })
    .then(function (d) {
      return (d.results || []).filter(function (m) { return m.poster_path && m.overview; }).map(fromTmdbMovie);
    }).catch(function (e) { state.diag.movies = e.message; return []; });
}
function loadTmdbShows() {
  return tmdb("discover/tv", { sort_by: "popularity.desc", page: 1 + rnd(30),
    "vote_count.gte": 150, include_adult: false, language: "en-US" })
    .then(function (d) {
      return (d.results || []).filter(function (t) { return t.poster_path && t.overview; }).map(fromTmdbTv);
    }).catch(function (e) { state.diag.shows = e.message; return []; });
}
function loadTvmaze() {
  return getJSON("https://api.tvmaze.com/shows?page=" + rnd(180)).then(function (arr) {
    return arr.filter(function (s) { return s.image && s.summary && s.rating && s.rating.average >= 6.8; })
      .map(fromTvmaze);
  }).catch(function (e) { state.diag.tvmaze = e.message; return []; });
}
function loadAnime() {
  return gJikan()
    .then(function () { return getJSON("https://api.jikan.moe/v4/top/anime?page=" + (1 + rnd(14)) + "&limit=25"); })
    .then(function (j) {
      return (j.data || []).filter(function (a) { return a.synopsis && a.images; }).map(fromJikan);
    }).catch(function (e) { state.diag.anime = e.message; return []; });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function refill() {
  if (state.busy) return Promise.resolve();
  state.busy = true;
  return loadGenres().then(function () {
    return Promise.all(worker ? [loadTmdbMovies(), loadTmdbShows(), loadAnime()]
                              : [loadTvmaze(), loadAnime()]);
  }).then(function (res) {
    var mixed = worker
      ? shuffle(res[0]).slice(0, 14).concat(shuffle(res[1]).slice(0, 10)).concat(shuffle(res[2]).slice(0, 8))
      : shuffle(res[0]).slice(0, 26).concat(shuffle(res[1]).slice(0, 9));
    var seen = {};
    state.queue.forEach(function (q) { seen[q.key] = 1; });
    state.queue = state.queue.concat(shuffle(mixed.filter(function (m) { return !seen[m.key]; })));
    state.busy = false;
  }).catch(function () { state.busy = false; });
}

/* --------------------------------------------------- detail: cast, seasons */

function detailFor(item) {
  if (state.detail[item.key]) return Promise.resolve(state.detail[item.key]);
  var p;
  if (item.source === "tmdb") {
    p = tmdb(item.sourceKind + "/" + item.sourceId, { append_to_response: "credits,external_ids" })
      .then(function (d) {
        var cast = ((d.credits && d.credits.cast) || []).slice(0, 40).map(function (c) {
          return { name: c.name, character: c.character || "",
            img: c.profile_path ? IMG_S + c.profile_path : null,
            pop: c.popularity || 0, billing: (c.order == null ? 999 : c.order) + 1 };
        });
        cast.sort(function (a, b) { return b.pop - a.pop; });
        cast = cast.slice(0, 24).map(function (c, n) { c.rank = n + 1; return c; });
        var seasons = (d.seasons || []).filter(function (s) { return s.season_number > 0; })
          .map(function (s) {

      .then(function (d) {
        var em = d._embedded || {};
        return {
          cast: (em.cast || []).slice(0, 24).map(function (c, n) {
            return { name: c.person ? c.person.name : "",
              character: c.character ? c.character.name : "",
              img: c.person && c.person.image ? c.person.image.medium : null,

          }),
          seasons: (em.seasons || []).filter(function (s) { return s.number; }).map(function (s) {

/* ---------------------------------------------------------------- render */

function otherName() {
  var o = state.users.filter(function (u) { return !state.me || u.id !== state.me.id; })[0];
  return o ? o.display_name : "They";
}

function chipsFor(it) {
  var mk = [], mi = state.mine[it.key] || blank(), th = state.theirs[it.key] || blank();
  function c(bg, fg, t) { return '<span class="chip" style="background:' + bg + ';color:' + fg + '">' + t + "</span>"; }
  if (mi.shared && th.shared) mk.push(c("rgba(239,159,39,.2)", "#fac775", "Both want this"));
  else if (mi.shared) mk.push(c("rgba(29,158,117,.2)", "#9fe1cb", "Shared"));
  else if (th.shared) mk.push(c("rgba(29,158,117,.14)", "#6fae95", esc(otherName()) + " wants this"));
  if (mi.solo) mk.push(c("rgba(127,119,221,.2)", "#cecbf6", "Only me"));

}

function cardHTML(it) {
  var bits = [];

  if (it.runtime) bits.push("<span>" + it.runtime + " min</span>");

function bindDesc() {

        '<p class="credit">Per-episode rating and notes arrive in V1.</p>');

}

var card = null;
function current() { return state.queue[state.i]; }

function paintRail() {
  var it = current(); if (!it) return;
  var mi = state.mine[it.key] || blank();
  var ew = el("aWatched");
  ew.className = "act" + (mi.watched ? " on" : "");
  ew.querySelector(".lbl").textContent = mi.watched ? "watched" : "watched";
  el("aNote").className = "act" + (mi.note ? " on" : "");
  var rate = el("aRate");
  rate.className = "act" + (mi.rating != null ? " on" : "");
  rate.querySelector(".lbl").textContent = mi.rating != null ? mi.rating.toFixed(1) : "rate";
}

function render() {
  var it = current();
  if (!it) return;
  if (!card) {
    card = document.createElement("div");
    card.className = "card";
    el("stage").appendChild(card);

  }
  state.expanded = false;
  card.classList.remove("anim");
  card.innerHTML = cardHTML(it);
  card.style.transform = "translate3d(0,0,0)";
  bindDesc();
  el("load").classList.add("off");
  paintRail();
  detailFor(it).then(function (d) { if (current() === it) paintDetail(it, d); });
  if (state.queue.length - state.i < 8) refill();
  var nx = state.queue[state.i + 1];
  if (nx && nx.poster) {
    var im = new Image();
    im.src = nx.poster;
    if (im.decode) im.decode().catch(function () {});
  }
}

function advance(dir) {
  var ni = state.i + dir;
  if (ni < 0) { bounce(); return; }
  if (ni >= state.queue.length) {
    refill().then(function () { if (state.queue[ni]) { state.i = ni; render(); } else bounce(); });
    return;
  }
  card.classList.add("anim");
  card.style.transform = "translate3d(0," + (dir > 0 ? "-102%" : "102%") + ",0)";
  setTimeout(function () { state.i = ni; render(); }, 250);
}
function bounce() {
  card.classList.add("anim");
  card.style.transform = "translate3d(0,-14px,0)";
  setTimeout(function () { card.style.transform = "translate3d(0,0,0)"; }, 180);
}

function flash(kind, text) {
  var f = el("flash");
  f.querySelector("span").textContent = text;
  f.className = "flash on " + kind;
  setTimeout(function () { f.className = "flash " + kind; }, 1100);
}

function collect(which) {
  var it = current();
  if (!it || !state.me) return;
  var kind = which === "sh" ? "playlist_shared" : "playlist_solo";
  var mi = mineOf(it.key);
  if (which === "sh") mi.shared = true; else mi.solo = true;
  counts();
  var th = state.theirs[it.key] || blank();
  var matched = which === "sh" && th.shared;
  flash(matched ? "mu" : which,
    matched ? "Match — " + otherName() + " wants this too"
            : (which === "sh" ? "Added to shared" : "Added to yours"));
  writeInteraction(it, kind).catch(function (e) { flash("so", "Not saved: " + e.message); });
  card.classList.add("anim");
  card.style.transform = "translate3d(" + (which === "sh" ? "112%" : "-112%") + ",0,0) rotate(" +
    (which === "sh" ? 8 : -8) + "deg)";
  setTimeout(function () { advance(1); }, 240);
}

function counts() {
  var sh = 0, so = 0;
  for (var k in state.mine) { if (state.mine[k].shared) sh++; if (state.mine[k].solo) so++; }

}

/* -------------------------------------------------------------- gestures */

function bindGestures(node) {
  var sx = 0, sy = 0, dx = 0, dy = 0, drag = false, axis = null, raf = 0, want = "";

  function paint() { raf = 0; node.style.transform = want; }
  function push(t) { want = t; if (!raf) raf = requestAnimationFrame(paint); }

  function insideScrollable(target) {
    var n = target;
    while (n && n !== node) {
      if (n.id === "desc" && state.expanded) return true;
      if (n.classList && n.classList.contains("seasons")) return true;
      n = n.parentNode;
    }
    return false;
  }

  node.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    if (insideScrollable(e.target)) { drag = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    dx = dy = 0; drag = true; axis = null;
    node.classList.remove("anim");
  }, { passive: true });

  node.addEventListener("touchmove", function (e) {
    if (!drag) return;
    dx = e.touches[0].clientX - sx;
    dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      else return;
    }
    if (axis === "y" && state.expanded) return;
    e.preventDefault();
    push(axis === "x"
      ? "translate3d(" + dx + "px,0,0) rotate(" + (dx / 38) + "deg)"
      : "translate3d(0," + dy + "px,0)");
  }, { passive: false });

  node.addEventListener("touchend", function () {
    if (!drag) return;
    drag = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    var TH = 70;
    if (axis === "x" && Math.abs(dx) > TH) { collect(dx > 0 ? "sh" : "so"); return; }
    if (axis === "y" && !state.expanded && Math.abs(dy) > TH) { advance(dy < 0 ? 1 : -1); return; }
    node.classList.add("anim");
    node.style.transform = "translate3d(0,0,0)";
  }, { passive: true });
}

document.addEventListener("keydown", function (e) {
  if (el("sheet").classList.contains("on")) { if (e.key === "Escape") closeSheet(); return; }
  if (el("prof").classList.contains("on")) { if (e.key === "Escape") el("prof").classList.remove("on"); return; }
  if (el("gate").classList.contains("on")) return;
  if (e.key === "ArrowUp") advance(-1);
  else if (e.key === "ArrowDown") advance(1);
  else if (e.key === "ArrowRight") collect("sh");
  else if (e.key === "ArrowLeft") collect("so");
});

var RATINGS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];

function rateSheet(it, picked) {
  var mi = state.mine[it.key] || blank();
  var sel = picked === undefined ? mi.rating : picked;
  var same = sel == null ? [] : state.ratings.filter(function (r) {
    return r.value === sel && r.key !== it.key;

  function build() {

    }).join("");

        ? '<p class="msg" style="margin-top:18px">You have rated ' + same.length + " other " +
          (same.length === 1 ? "title" : "titles") + " exactly " + sel.toFixed(1) + ":</p>" +
          same.slice(0, 40).map(function (r) {
            var rec = mediaCache[r.key] || {};

              '<div class="ly">' + (rec.year || "") + "</div></div>";
          }).join("")
        : '<p class="msg" style="margin-top:18px">Nothing else sits at ' + sel.toFixed(1) +
          " yet. This title defines the shelf.</p>";

    openSheet("Rate — " + it.title,
      '<div class="stars">' + stars + "</div>" + panel +
      '<div><button class="f" id="rSave"' + (sel == null ? " disabled" : "") + ">Save" +
        (sel != null ? " " + sel.toFixed(1) : "") + "</button>" +
      (mi.rating != null ? '<button class="f g" id="rClear">Clear</button>' : "") + "</div>");

    Array.prototype.forEach.call(el("shBody").querySelectorAll(".star"), function (node) {
      node.onclick = function () {
        var v = parseFloat(node.dataset.v);
        rateSheet(it, v === sel ? null : v);
      };
    });
    el("rSave").onclick = function () {
      if (sel == null) return;
      mineOf(it.key).rating = sel;
      var exist = state.ratings.filter(function (r) { return r.key === it.key; })[0];
      if (exist) exist.value = sel; else state.ratings.push({ key: it.key, value: sel });
      mediaCache[it.key] = { key: it.key, title: it.title, year: it.year, kind: it.kind,
        poster: it.poster, genres: it.genres || [] };
      paintRail(); closeSheet();
      var ch = card.querySelector(".chips");
      if (ch) ch.innerHTML = chipsFor(it);
      writeInteraction(it, "rating", sel).catch(function (e) { flash("so", "Not saved: " + e.message); });
    };
    if (el("rClear")) el("rClear").onclick = function () {
      mineOf(it.key).rating = null;
      state.ratings = state.ratings.filter(function (r) { return r.key !== it.key; });
      paintRail(); closeSheet();
      var ch2 = card.querySelector(".chips");
      if (ch2) ch2.innerHTML = chipsFor(it);
      dropInteraction(it, "rating").catch(function () {});
    };
  }
  loadMediaRows(same.map(function (r) { return r.key; })).then(build);
}

/* ----------------------------------------------------------------- lists */

function listRows(keys, mode) {
  return keys.map(function (k) {
    var rec = mediaCache[k] || {}, mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
    var bars = [];
    if (mi.shared || th.shared) bars.push('<i style="background:#1D9E75"></i>');
    if (mi.solo) bars.push('<i style="background:#7F77DD"></i>');

    if (mode === "shared") {
      if (mi.shared && th.shared) who = '<div class="who" style="background:rgba(239,159,39,.25);color:#fac775">2</div>';
      else if (th.shared) who = '<div class="who" style="background:rgba(29,158,117,.22);color:#9fe1cb">' +
        esc((otherName() || "?").charAt(0)) + "</div>";
      else who = '<div class="who" style="background:rgba(29,158,117,.22);color:#9fe1cb">' +
        esc(state.me ? state.me.initial : "?") + "</div>";
    }
    return '<div class="lrow"><div class="lbar">' + (bars.join("") || '<i style="background:#333"></i>') + "</div>" +
      '<div class="lt">' + esc(rec.title || k) +
      (mi.rating != null ? ' <span style="color:#5dcaa5;font-size:12px">' + mi.rating.toFixed(1) + "</span>" : "") +
      "</div>" + who + '<div class="ly">' + (rec.year || "") + "</div></div>";
  }).join("");
}

function showList(mode) {
  var keys = [], title, k;
  if (mode === "mutual") { keys = mutualKeys(); title = "Both want this"; }
  else if (mode === "shared") {
    var set = {};
    for (k in state.mine) if (state.mine[k].shared) set[k] = 1;
    for (k in state.theirs) if (state.theirs[k].shared) set[k] = 1;
    keys = Object.keys(set); title = "Shared list";
  } else {
    for (k in state.mine) if (state.mine[k].solo) keys.push(k);
    title = "Only me";
  }
  if (!keys.length) { openSheet(title, '<p class="msg">Nothing here yet.</p>'); return; }
  openSheet(title, '<p class="msg">Loading…</p>');
  loadMediaRows(keys).then(function () {
    openSheet(title, listRows(keys, mode) + '<p class="credit">' + (mode === "mutual"
      ? "Titles you have both swiped right. This is the list that decides what you watch together."
      : mode === "shared"
        ? "Everything either of you put forward. A single initial is a request; a 2 is a match."
        : "Yours alone. " + esc(otherName()) + " never sees this list.") + "</p>");
  });
}
el("pMu").onclick = function () { showList("mutual"); };
el("pSh").onclick = function () { showList("shared"); };
el("pSo").onclick = function () { showList("solo"); };

/* --------------------------------------------------------------- profile */

var pfTab = "tiers";
var libFilter = { type: "all", list: "all", decade: "all", genres: {} };

function touchedKeys() {
  var out = [];
  for (var k in state.mine) {
    var m = state.mine[k];
    if (m.shared || m.solo || m.watched || m.rating != null || m.note) out.push(k);
  }
  return out;
}

function tierOf(rating) {
  if (rating == null) return 0;
  for (var i = 0; i < state.tiers.length; i++) {
    var t = state.tiers[i];
    if (t.lower_bound == null) continue;
    if (rating > Number(t.lower_bound) && rating <= Number(t.upper_bound)) return t.idx;
  }
  return 0;
}

function tileHTML(k) {
  var rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
  return '<div class="tile" data-k="' + esc(k) + '">' +
    '<div class="tp" style="' + (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '"></div>' +
    '<div class="tt">' + esc(rec.title || k) + "</div></div>";
}

function renderTiers() {
  var keys = touchedKeys();
  var byTier = {};
  state.tiers.forEach(function (t) { byTier[t.idx] = []; });
  if (!byTier[0]) byTier[0] = [];
  keys.forEach(function (k) {
    var idx = tierOf((state.mine[k] || blank()).rating);
    (byTier[idx] = byTier[idx] || []).push(k);
  });
  var html = state.tiers.map(function (t) {
    var ks = byTier[t.idx] || [];
    var bounds = t.lower_bound == null ? "no rating"
      : Number(t.lower_bound).toFixed(1) + " – " + Number(t.upper_bound).toFixed(1);
    return '<div class="tier"><div class="tierHead">' +
      '<span class="tl" data-idx="' + t.idx + '">' + esc(t.label) + "</span>" +
      '<span class="tb">' + bounds + "</span>" +
      '<span class="tc">' + ks.length + "</span></div>" +
      (ks.length ? '<div class="strip">' + ks.map(tileHTML).join("") + "</div>"
                 : '<p class="empty">Nothing here yet.</p>') + "</div>";
  }).join("");
  el("pfBody").innerHTML = html +
    '<p class="credit" style="padding:0 18px">Tap a shelf name to rename it. Shelf bounds are fixed; ' +
    "what each one means is yours to decide.</p>";

  Array.prototype.forEach.call(el("pfBody").querySelectorAll(".tl"), function (node) {
    node.onclick = function () {
      var idx = parseInt(node.dataset.idx, 10);
      var t = state.tiers.filter(function (x) { return x.idx === idx; })[0];
      openSheet("Rename shelf",
        '<label class="f" for="tn">Shelf ' + idx + " name</label>" +
        '<input class="f" id="tn" value="' + esc(t.label) + '" maxlength="24">' +
        '<div><button class="f" id="tSave">Save</button></div>');
      el("tSave").onclick = function () {
        var v = el("tn").value.trim();
        if (!v) { el("tn").focus(); return; }
        t.label = v; closeSheet(); renderTiers();
        sbPatch("tier", "user_id=eq." + state.me.id + "&idx=eq." + idx, { label: v }).catch(function () {});
      };
    };
  });
  bindTiles();
}

function bindTiles() {
  Array.prototype.forEach.call(el("pfBody").querySelectorAll("[data-k]"), function (node) {
    node.onclick = function () {
      var k = node.dataset.k, rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
      var th = state.theirs[k] || blank();
      var lines = [];
      if (mi.rating != null) lines.push("You rated it " + mi.rating.toFixed(1));
      if (mi.watched) lines.push("Marked watched");
      if (mi.shared && th.shared) lines.push("You both want it");
      else if (mi.shared) lines.push("You put it on the shared list");
      else if (th.shared) lines.push(otherName() + " put it on the shared list");
      if (mi.solo) lines.push("On your own list");
      openSheet(rec.title || k,
        '<p class="msg">' + (rec.year ? rec.year + " · " : "") + esc(rec.kind || "") + "</p>" +
        (lines.length ? '<p class="msg">' + esc(lines.join(". ")) + ".</p>" : "") +
        (mi.note ? '<p class="short" style="margin-top:14px">' + esc(mi.note) + "</p>" : "") +
        '<p class="credit">Editing from here arrives with the library rework; for now the feed is where you change things.</p>');
    };
  });
}

function renderLibrary() {
  var keys = touchedKeys();
  var kinds = {}, decades = {}, genres = {};
  keys.forEach(function (k) {
    var rec = mediaCache[k] || {};
    if (rec.kind) kinds[rec.kind] = 1;
    if (rec.year) decades[Math.floor(rec.year / 10) * 10] = 1;
    (rec.genres || []).forEach(function (g) { genres[g] = 1; });
  });

  function chipRow(id, label, active) {
    return '<div class="fch' + (active ? " on" : "") + '" data-f="' + id + '">' + esc(label) + "</div>";
  }
  var f = libFilter;
  var typeChips = ["all"].concat(Object.keys(kinds).sort())
    .map(function (t) { return chipRow("type:" + t, t === "all" ? "All types" : t, f.type === t); }).join("");
  var listChips = [["all", "Everything"], ["both", "Both want"], ["shared", "Shared"],
                   ["solo", "Only me"], ["rated", "Rated"], ["watched", "Watched"], ["note", "With a note"]]
    .map(function (p) { return chipRow("list:" + p[0], p[1], f.list === p[0]); }).join("");
  var decChips = ["all"].concat(Object.keys(decades).sort(function (a, b) { return b - a; }))
    .map(function (d) { return chipRow("dec:" + d, d === "all" ? "Any decade" : d + "s", f.decade === d); }).join("");
  var genChips = Object.keys(genres).sort()
    .map(function (g) { return chipRow("gen:" + g, g, !!f.genres[g]); }).join("");

  var shown = keys.filter(function (k) {
    var rec = mediaCache[k] || {}, mi = state.mine[k] || blank(), th = state.theirs[k] || blank();
    if (f.type !== "all" && rec.kind !== f.type) return false;
    if (f.decade !== "all" && String(Math.floor((rec.year || 0) / 10) * 10) !== f.decade) return false;
    if (f.list === "both" && !(mi.shared && th.shared)) return false;
    if (f.list === "shared" && !mi.shared) return false;
    if (f.list === "solo" && !mi.solo) return false;
    if (f.list === "rated" && mi.rating == null) return false;
    if (f.list === "watched" && !mi.watched) return false;
    if (f.list === "note" && !mi.note) return false;
    var want = Object.keys(f.genres);
    if (want.length) {
      var have = rec.genres || [];
      for (var i = 0; i < want.length; i++) if (have.indexOf(want[i]) < 0) return false;
    }
    return true;
  }).sort(function (a, b) {
    var ra = (state.mine[a] || blank()).rating, rb = (state.mine[b] || blank()).rating;
    if (ra == null && rb == null) return 0;
    if (ra == null) return 1;
    if (rb == null) return -1;
    return rb - ra;
  });

  el("pfBody").innerHTML =
    '<div id="filters">' + typeChips + listChips + "</div>" +
    '<div id="filters2" style="display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px">' + decChips + genChips + "</div>" +
    (shown.length
      ? '<div class="grid">' + shown.map(function (k) {
          var rec = mediaCache[k] || {}, mi = state.mine[k] || blank();
          return '<div class="gcell" data-k="' + esc(k) + '">' +
            '<div class="gp" style="' + (rec.poster ? "background-image:url('" + esc(rec.poster) + "')" : "") + '">' +
            (mi.rating != null ? '<span class="gr">' + mi.rating.toFixed(1) + "</span>" : "") + "</div>" +
            '<div class="gt">' + esc(rec.title || k) + "</div></div>";
        }).join("") + "</div>"
      : '<p class="empty" style="padding:18px">Nothing matches these filters.</p>') +
    '<p class="credit" style="padding:12px 18px 0">' + shown.length + " of " + keys.length +
    " titles you have touched. Genres filter as AND, not OR.</p>";

  Array.prototype.forEach.call(el("prof").querySelectorAll(".fch"), function (node) {
    node.onclick = function () {
      var parts = node.dataset.f.split(":"), kind = parts[0], val = parts.slice(1).join(":");
      if (kind === "type") libFilter.type = val;
      else if (kind === "list") libFilter.list = val;
      else if (kind === "dec") libFilter.decade = val;
      else if (kind === "gen") {
        if (libFilter.genres[val]) delete libFilter.genres[val];
        else libFilter.genres[val] = 1;
      }
      renderLibrary();
    };
  });
  bindTiles();
}

    (v ? getJSON(v + "/tmdb/configuration") : Promise.resolve()).then(function () {
      worker = v;
      try { localStorage.setItem(K_WORKER, v || "none"); } catch (e) {}
      location.reload();
    }).catch(function () { el("wkSave").textContent = "Failed — check the worker"; });
  };
  el("swap").onclick = function () {
    try { localStorage.removeItem(K_ME); } catch (e) {}
    location.reload();
  };
}

function openProfile() {
  if (!state.me) return;
  el("pfAv").textContent = state.me.initial;
  el("pfAv").style.background = state.me.bar_colour;
  el("pfNm").textContent = state.me.display_name;
  el("prof").classList.add("on");
  el("pfBody").innerHTML = '<p class="msg" style="padding:0 18px">Loading…</p>';
  Promise.all([loadTiers(), loadMediaRows(touchedKeys())]).then(function () { paintProfile(); });
}
function paintProfile() {
  Array.prototype.forEach.call(el("pfTabs").querySelectorAll(".tab"), function (n) {
    n.className = "tab" + (n.dataset.t === pfTab ? " on" : "");
  });
  if (pfTab === "tiers") renderTiers();
  else if (pfTab === "library") renderLibrary();
  else renderSettings();
}
Array.prototype.forEach.call(el("pfTabs").querySelectorAll(".tab"), function (n) {
  n.onclick = function () { pfTab = n.dataset.t; paintProfile(); };
});
el("pfX").onclick = function () { el("prof").classList.remove("on"); counts(); };
el("pMe").onclick = openProfile;

/* ------------------------------------------------------------------ gate */

function showGate() {
  var btns = state.users.map(function (u) {
    return '<button class="who-btn" data-id="' + esc(u.id) + '">' +
      '<span class="av" style="background:' + esc(u.bar_colour) + '">' + esc(u.initial) + "</span>" +
      '<span class="nm">' + esc(u.display_name) + "</span></button>";
  }).join("");
  el("gate").innerHTML = "<h3>Who's swiping?</h3>" +
    "<p>Stored on this device. Switch any time from your profile.</p>" + btns;
  el("gate").classList.add("on");
  el("load").classList.add("off");
  Array.prototype.forEach.call(el("gate").querySelectorAll(".who-btn"), function (node) {
    node.onclick = function () {
      state.me = state.users.filter(function (x) { return x.id === node.dataset.id; })[0];
      try { localStorage.setItem(K_ME, JSON.stringify(state.me)); } catch (e) {}
      el("gate").classList.remove("on");
      el("load").classList.remove("off");
      start();
    };
  });
}

/* ------------------------------------------- one-time local swipe import */

function importLegacy() {
  var raw;
  try { raw = localStorage.getItem(K_LEGACY); } catch (e) { return Promise.resolve(); }
  if (!raw) return Promise.resolve();
  var old;
  try { old = JSON.parse(raw); } catch (e) { return Promise.resolve(); }
  var jobs = [];
  ["shared", "solo"].forEach(function (b) {
    Object.keys(old[b] || {}).forEach(function (k) {
      jobs.push({ key: k, kind: b === "shared" ? "playlist_shared" : "playlist_solo", v: old[b][k] });
    });
  });
  if (!jobs.length) { try { localStorage.removeItem(K_LEGACY); } catch (e) {} return Promise.resolve(); }
  var mediaRows = {}, inter = [];
  jobs.forEach(function (j) {
    mediaRows[j.key] = { key: j.key, source: j.key.split(":")[0], kind: j.v.kind || "movie",
      title: j.v.title || j.key, year: j.v.year || null, poster: null };
    inter.push({ user_id: state.me.id, media_key: j.key, kind: j.kind, value: null });
  });
  return sbUpsert("media", Object.keys(mediaRows).map(function (k) { return mediaRows[k]; }), "key")
    .then(function () { return sbUpsert("interaction", inter, "user_id,media_key,kind"); })
    .then(function () { try { localStorage.removeItem(K_LEGACY); } catch (e) {} })
    .catch(function () {});
}

/* ------------------------------------------------------------------ boot */

var booted = false;

function failScreen(headline) {
  if (booted) return;
  var order = ["db", "genres", "movies", "shows", "tvmaze", "anime"];
  var lines = order.filter(function (k) { return state.diag[k]; })
    .map(function (k) { return k + " — " + esc(state.diag[k]); });
  el("load").innerHTML =
    '<p style="font-size:14px;color:#cfcdc5;text-align:center;padding:0 32px;line-height:1.6">' + esc(headline) + "</p>" +
    (lines.length ? '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px;line-height:1.8;font-family:ui-monospace,monospace">' + lines.join("<br>") + "</p>"
      : '<p style="font-size:12px;color:#85837b;text-align:center;padding:0 28px">No source reported an error, which usually means the requests never returned.</p>') +
    '<div style="display:flex;gap:8px;margin-top:4px"><button class="f" id="btnRetry">Retry</button>' +
    '<button class="f g" id="btnNoTmdb">Run without TMDB</button></div>';
  el("btnRetry").onclick = function () { location.reload(); };
  el("btnNoTmdb").onclick = function () {
    try { localStorage.setItem(K_WORKER, "none"); } catch (e) {}
    location.reload();
  };
}

function start() {
  el("pMe").textContent = state.me ? state.me.initial : "?";
  el("pMe").style.background = state.me ? state.me.bar_colour : "#333";
  setTimeout(function () { failScreen("Timed out waiting for the sources."); }, 16000);
  loadMine()
    .then(importLegacy)
    .then(loadMine)
    .then(loadTiers)
    .then(function () { counts(); return refill(); })
    .then(function () {
      if (!state.queue.length) { failScreen("No source returned anything."); return; }
      booted = true;
      render();
    })
    .catch(function (e) { failScreen("The feed failed to start: " + (e && e.message ? e.message : "unknown")); });
}

sbGet("app_user?select=id,handle,display_name,initial,bar_colour&order=created_at").then(function (rows) {
  state.users = rows || [];
  if (!state.users.length) { failScreen("No people in the database. Run the seed in schema.sql."); return; }
  if (state.me) {
    var still = state.users.filter(function (u) { return u.id === state.me.id; })[0];
    if (still) { state.me = still; start(); return; }
  }
  showGate();
}).catch(function (e) {
  state.diag.db = e.message;
  failScreen("Could not reach Supabase.");
});
</script>
</body>
